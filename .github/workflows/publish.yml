name: Publish

on:
  pull_request:
    types: [closed]
    branches: [master]
  # For the first release, or to retry one that failed.
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

# Each job releases what its manifest's version names unless that version's tag
# already exists, so a rerun skips what already went out.
jobs:
  npm:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'automated-version-bump'))
    runs-on: ubuntu-latest
    permissions:
      # Tags each published version.
      contents: write
      # npm trusted publishing (OIDC) and provenance.
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: master
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          # The runner's cached 22.x can lag; dependencies need >= 22.22.2.
          check-latest: true
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@11

      # The SDK's build is tsc alone, and skipping install scripts keeps
      # dependency code from running in a job that can publish.
      - run: npm ci --ignore-scripts

      - run: npx nx run-many -t build --projects=@tereo-io/sdk

      # npm authenticates through the package's trusted publisher (this
      # workflow's OIDC token); there is no npm token.
      - name: Publish unreleased versions
        env:
          GH_TOKEN: ${{ github.token }}
          # npm refuses provenance for private repositories.
          PROVENANCE: ${{ github.event.repository.private && '--no-provenance' || '--provenance' }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          for name in $(node -p "require('./nx.json').release.groups.sdk.projects.join(' ')"); do
            version=$(npm pkg get version -w "$name" | node -p "Object.values(JSON.parse(require('fs').readFileSync(0)))[0]")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm"
            else
              npm publish -w "$name" "$PROVENANCE"
            fi
            # A version published by hand, or by a run that failed to tag it,
            # still gets its tag.
            if git rev-parse -q --verify "refs/tags/$name@$version" >/dev/null; then
              echo "$name@$version is already tagged"
              continue
            fi
            git tag "$name@$version"
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" \
              push origin "$name@$version"
          done

  image:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'automated-version-bump'))
    runs-on: ubuntu-latest
    permissions:
      # Tags each published version.
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: master
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # tereo and tereo-ui are one fixed release group, so either manifest
      # names the image's version.
      - name: Check for an unreleased version
        id: version
        run: |
          version=$(node -p "require('./packages/tereo/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/tereo@$version" >/dev/null; then
            echo "tereo@$version is already released"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.version.outputs.release == 'true'

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.version.outputs.release == 'true'

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.version.outputs.release == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The source label links the package to this repository, so it takes the
      # repository's access settings.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        if: steps.version.outputs.release == 'true'
        id: meta
        with:
          context: git
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=tereo
            org.opencontainers.image.description=Tereo: auth, file storage, webhooks, notifications and audit logging for one app

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.version.outputs.release == 'true'
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          cache-from: type=gha
          # The cache only speeds up builds: a failed export must not fail the
          # job and skip the chart push and tag.
          cache-to: type=gha,mode=max,ignore-error=true

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: steps.version.outputs.release == 'true'
        with:
          version: v4.2.0

      # The chart is released with the image it runs: same version, and its
      # appVersion picks that image's tag.
      - name: Push the Helm chart
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          helm package charts/tereo --version "$VERSION" --app-version "$VERSION" --destination dist-chart
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm push "dist-chart/tereo-$VERSION.tgz" "oci://ghcr.io/$OWNER/charts"

      - name: Tag the release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "tereo@$VERSION"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" \
            push origin "tereo@$VERSION"
