name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Started by create-version-pr.yml on release/version-bump: its PR is opened
  # with the built-in token, which triggers no pull_request workflows.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # nx-set-shas looks up this workflow's last successful run on master.
  actions: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # A PR or a push to master runs only the projects it affects (NX_BASE and
      # NX_HEAD come from nx-set-shas). The version-bump branch, started by
      # hand, has no earlier run to compare with and runs every project.
      NX_SCOPE: ${{ github.event_name == 'workflow_dispatch' && 'run-many' || 'affected' }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          # The runner's cached 22.x can lag; dependencies need >= 22.22.2.
          check-latest: true

      - run: npm ci

      # A PR's base is where it branched from master; a push's is the last
      # commit whose CI passed on master, so a failed or cancelled run's
      # changes are tested again by the next one.
      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
        with:
          main-branch-name: master

      - name: Generate Prisma client
        run: npx nx run-many -t generate --parallel=4

      - name: Check formatting
        run: npm run format:check

      - name: Check import order
        run: npm run sort-imports:check

      - name: Lint
        run: npm run lint

      # Lints, then bundles; the committed bundle must match the source.
      - name: Lint and bundle OpenAPI spec
        run: |
          npm run openapi:build -w tereo
          git diff --exit-code packages/tereo/openapi/bundled-openapi.yaml

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.0

      # Every example values file must lint; the chart's guards fail rendering
      # on a configuration core would refuse.
      - name: Lint Helm chart
        run: |
          for values in charts/tereo/ci/*.yaml; do
            helm lint --strict charts/tereo -f "$values"
          done
          charts/tereo/tests/provisioning.sh

      - name: Type check
        run: npx nx $NX_SCOPE -t check --parallel=4

      - name: Build
        run: npx nx $NX_SCOPE -t build --parallel=4

      # tereo's unit tests need no database, Redis or server.
      - name: Unit tests
        run: npx nx $NX_SCOPE -t test:unit --parallel=4

      # tereo's suite runs in TEST_SHARDS isolated stacks at once
      # (docker/test/run.sh), one per core of the runner.
      - name: Test
        run: npx nx $NX_SCOPE -t test:docker --parallel=4
        env:
          TEST_SHARDS: 4

      # The release image, built and started on this x86 runner: migrate and
      # seed a fresh database, then wait for core's health check and load the
      # UI, so a broken Dockerfile or image fails here rather than at release.
      - name: Smoke-test Docker image
        run: |
          docker compose -p smoke up -d --build --wait --wait-timeout 300 core
          curl -sf http://localhost:4001/health
          curl -sf -o /dev/null -H 'Accept: text/html' http://localhost:4001/setup

      - name: Show smoke-test logs
        if: failure()
        run: docker compose -p smoke logs --no-color migrate core || true

      - name: Tear down test stack
        if: always()
        run: |
          docker/test/run.sh down -v --remove-orphans || true
          docker compose -p smoke down -v --remove-orphans || true

  # The admin UI's workflows in Chromium against a real core, Postgres and
  # Redis (packages/tereo-e2e), beside the `ci` job. It runs when tereo,
  # tereo-ui or tereo-e2e is affected; tereo-e2e lists the other two as
  # implicit dependencies.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NX_SCOPE: ${{ github.event_name == 'workflow_dispatch' && 'run-many' || 'affected' }}

    # The ports and credentials tereo-e2e's config defaults to, as in
    # docker-compose.yml.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: core
          POSTGRES_PASSWORD: core
          POSTGRES_DB: core
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -U core -d core"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6389:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          check-latest: true

      - run: npm ci

      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
        with:
          main-branch-name: master

      - name: Check whether the suite is affected
        id: affected
        run: |
          if [ "$NX_SCOPE" = run-many ] ||
            npx nx show projects --affected -p tereo-e2e | grep -q tereo-e2e; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "tereo, tereo-ui and tereo-e2e are unaffected; skipping the e2e suite."
          fi

      - name: Generate Prisma client
        if: steps.affected.outputs.run == 'true'
        run: npx nx run-many -t generate --parallel=4

      - name: Read Playwright version
        if: steps.affected.outputs.run == 'true'
        id: playwright
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.affected.outputs.run == 'true'
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The browser comes from the cache; its system libraries never do.
      - name: Install Chromium
        if: steps.affected.outputs.run == 'true'
        env:
          CACHE_HIT: ${{ steps.browsers.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = true ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      # CI (set by Actions) gives the run 1 retry and 2 workers, fails on
      # .only, and adds the GitHub reporter's annotations. Only the release
      # PR's branch runs the tests tagged @slow, so every test still runs
      # before a release. create-version-pr.yml starts that run by hand, so
      # match the ref as well as a PR's head.
      - name: Run e2e suite
        if: steps.affected.outputs.run == 'true'
        env:
          E2E_SCRIPT: ${{ (github.head_ref == 'release/version-bump' || github.ref_name == 'release/version-bump') && 'e2e:all' || 'e2e' }}
        run: npm run "$E2E_SCRIPT"

      - name: Upload e2e report
        if: failure() && steps.affected.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            packages/tereo-e2e/playwright-report/
            packages/tereo-e2e/test-results/
            packages/tereo-e2e/.e2e-state/core.log
          # .e2e-state is a dot-directory, which the action skips by default.
          include-hidden-files: true
          retention-days: 14
