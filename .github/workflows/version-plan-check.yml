name: Version Plan Check

on:
  pull_request:
    branches: [master]
  # Started by create-version-pr.yml on release/version-bump, where the job is
  # skipped: a skipped job still satisfies the required check.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version-plan:
    if: github.head_ref != 'release/version-bump' && github.ref_name != 'release/version-bump'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          # The runner's cached 22.x can lag; dependencies need >= 22.22.2.
          check-latest: true

      # plan:check builds the Nx project graph from the checked-in package.json
      # files (nx.json has no inference plugins), so it never needs the workspace
      # packages' node_modules — only Nx itself and @nx/js (JS release version
      # actions). Installing just those two skips the full `npm ci` (~960MB → ~200MB).
      # Versions are read from the committed package.json so they can't drift from
      # the workspace; nx and its plugin must stay version-matched.
      - name: Install Nx only
        run: |
          NX_VERSION=$(node -p "require('./package.json').devDependencies.nx")
          JS_VERSION=$(node -p "require('./package.json').devDependencies['@nx/js']")
          npm install --no-save --no-workspaces --ignore-scripts \
            "nx@${NX_VERSION}" "@nx/js@${JS_VERSION}"

      # Ask Nx — not a path grep — whether a version plan is required. Nx only
      # considers releasable projects (those in nx.json's release groups: the
      # SDK, and tereo with tereo-ui, whose version tags core's image), so other
      # changes don't demand a plan. Passes when every touched releasable project
      # has an applicable plan, or none require one.
      - name: Check version plans cover touched releasable projects
        run: npx --no-install nx release plan:check --base=origin/master --head=HEAD
