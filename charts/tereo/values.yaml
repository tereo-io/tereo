# Tereo is deployed once per app: each install is one app's core, with its own
# database, Redis, keys and admin. Postgres and Redis are not part of this
# chart; point it at yours through the secret below.

image:
  repository: ghcr.io/tereo-io/tereo
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Core's externally reachable https:// URL (required). The OIDC issuer, share
# and presigned links and the admin UI's address are built from it.
publicUrl: ""

# Browser origins allowed to call core. Empty means just publicUrl's origin,
# which is where core serves its own admin UI.
corsAllowedOrigins: []

# The proxies in front of core (required): "1" for a single ingress hop, a CIDR
# list, or "false" when nothing proxies. "true" is refused by core.
trustProxy: ""

# Where core's admin UI is served. Empty means publicUrl, where core serves it.
uiBaseUrl: ""

redis:
  # Leave both empty to use REDIS_URL from the secret. Set both for Sentinel;
  # the password then comes from REDIS_PASSWORD in the secret.
  sentinels: ""
  masterName: ""
  # Database index, 0-15 (REDIS_DB). Empty keeps REDIS_URL's path, else 0.
  db: ""
  # Prefix for every key and channel core uses (REDIS_KEY_PREFIX), e.g.
  # "app1:", so several cores can share one Redis. App services pass the same
  # value as the SDK's channelPrefix.
  keyPrefix: ""

# OTLP/HTTP endpoint for traces, e.g. http://otel-collector:4318. Empty
# disables export.
otelExporterEndpoint: ""

logLevel: info

# Further plain settings, as NAME: value (see docs/configuration.md).
env: {}

# Further env sources, e.g. a ConfigMap or Secret of your own.
extraEnvFrom: []

# Provisioning documents (packages/tereo/docs/provisioning.md): each entry is
# one document, rendered as <name>.json in a ConfigMap mounted at
# /etc/tereo/provisioning, where PROVISIONING_PATH points. Core applies them at
# start, and a post-install/post-upgrade Job runs `provision` so a changed
# document takes effect without a restart (job.enabled: false leaves it to the
# next start). Empty renders neither. Secrets are
# never written here: `secretFrom` names an environment variable, which must
# be a key of secrets.existingSecret (or the Secret built by
# secrets.externalSecret), or come from extraEnvFrom.
#
# provisioning:
#   documents:
#     billing:
#       version: 1.0.0
#       service:
#         slug: billing-service
#         name: Billing
#         secretFrom: BILLING_CLIENT_SECRET
provisioning:
  documents: {}
  # Mount a ConfigMap you manage (one *.json key per document) instead; the
  # chart then renders no ConfigMap of its own.
  existingConfigMap: ""
  job:
    enabled: true
    # Merged onto the Job's hook annotations, overriding any it shares, e.g.
    # argocd.argoproj.io/hook: Sync to run it in Argo CD's Sync phase.
    annotations: {}
    backoffLimit: 1
    activeDeadlineSeconds: 300
    resources: {}

secrets:
  # A Secret you manage, holding DATABASE_URL, CORE_KEK (openssl rand -base64
  # 32), and REDIS_URL, or REDIS_PASSWORD when using Sentinel. Every key in it
  # becomes an environment variable.
  existingSecret: ""

  # Or let External Secrets Operator build that Secret from your store.
  externalSecret:
    enabled: false
    refreshInterval: 1h
    secretStoreRef:
      name: ""
      kind: ClusterSecretStore
    # ExternalSecret `data` entries, e.g.
    #   - secretKey: DATABASE_URL
    #     remoteRef:
    #       key: tereo-database-url
    data: []
    # ExternalSecret `dataFrom` entries.
    dataFrom: []

# Runs the image's migrate-and-seed.sh (migrations, then the idempotent seed)
# as a Helm hook before each install and upgrade. Under ArgoCD it runs as a
# PreSync hook.
migrations:
  enabled: true
  backoffLimit: 2
  activeDeadlineSeconds: 600
  resources: {}

# Core keeps file blobs on this volume. More than one core pod (replicaCount
# above 1, or worker.enabled) needs a ReadWriteMany volume.
persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi

# The API pods. With worker.enabled false they also run the background
# workers (ROLE=all).
replicaCount: 1

# A separate Deployment for the background workers (ROLE=worker), leaving the
# API pods ROLE=api.
worker:
  enabled: false
  replicaCount: 1
  resources: {}

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

service:
  type: ClusterIP
  port: 80
  # More than one API pod needs sticky sessions for socket.io's polling
  # fallback (see the README). With Traefik:
  #   traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
  #   traefik.ingress.kubernetes.io/service.sticky.cookie.name: tereo_affinity
  #   traefik.ingress.kubernetes.io/service.sticky.cookie.secure: "true"
  #   traefik.ingress.kubernetes.io/service.sticky.cookie.httponly: "true"
  # ingress-nginx does it from the Ingress instead (ingress.annotations).
  annotations: {}

# Seconds an API pod keeps serving after it is told to stop, so the ingress has
# stopped sending it requests before core shuts down. 0 disables the delay.
preStopSleepSeconds: 5

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Defaults to publicUrl's host.
  host: ""
  tls: []
  #  - secretName: tereo-tls
  #    hosts:
  #      - core.example.com

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

# The image runs as the nodejs user, 1001.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
