publicUrl: https://core.example.com
trustProxy: "1"
secrets:
  # Holds DATABASE_URL, CORE_KEK, REDIS_URL, and the secrets named by
  # secretFrom below (ALPHA_CLIENT_SECRET, ...).
  existingSecret: tereo-secrets
worker:
  enabled: true
persistence:
  accessModes:
    - ReadWriteMany
provisioning:
  documents:
    alpha:
      version: 1.0.0
      service:
        slug: alpha-service
        name: Alpha
        secretFrom: ALPHA_CLIENT_SECRET
    beta:
      version: 1.0.0
      clients:
        - clientId: beta-web
          name: Beta web app
          clientType: public
          redirectUris:
            - https://beta.example.com/callback
          scopes: [openid, profile, email]
          audience: [alpha-service]
          consentRequired: false
