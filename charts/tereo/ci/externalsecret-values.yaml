publicUrl: https://core.example.com
trustProxy: "1"
redis:
  sentinels: redis-sentinel-0:26379,redis-sentinel-1:26379
  masterName: mymaster
secrets:
  externalSecret:
    enabled: true
    secretStoreRef:
      name: bitwarden
    data:
      - secretKey: DATABASE_URL
        remoteRef:
          key: tereo-database-url
      - secretKey: CORE_KEK
        remoteRef:
          key: tereo-core-kek
      - secretKey: REDIS_PASSWORD
        remoteRef:
          key: tereo-redis-password
