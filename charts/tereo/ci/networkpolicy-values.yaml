publicUrl: https://core.example.com
trustProxy: "1"
secrets:
  existingSecret: tereo-secrets
ingress:
  enabled: true
  className: nginx
  tls:
    - secretName: core-tls
      hosts:
        - core.example.com
networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
      podSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: billing
