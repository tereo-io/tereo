apiVersion: v1
kind: Service
metadata:
  name: {{ include "tereo.fullname" . }}
  labels:
    {{- include "tereo.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "tereo.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
