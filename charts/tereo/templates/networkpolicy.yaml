{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tereo.fullname" . }}
  labels:
    {{- include "tereo.labels" . | nindent 4 }}
spec:
  # The API pods only: the worker's port serves nothing but its health probe.
  podSelector:
    matchLabels:
      {{- include "tereo.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: http
{{- end }}
