{{- if and .Values.provisioning.documents (not .Values.provisioning.existingConfigMap) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tereo.provisioningConfigMap" . }}
  labels:
    {{- include "tereo.labels" . | nindent 4 }}
data:
  {{- range $name, $doc := .Values.provisioning.documents }}
  {{ $name }}.json: {{ toJson $doc | quote }}
  {{- end }}
{{- end }}
