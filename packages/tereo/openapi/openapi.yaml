tags:
  # Auth
  - name: OAuth2/OIDC - Authorization
    description: OAuth 2.0 authorization flow endpoints (authorize, consent)
  - name: OAuth2/OIDC - Upstream Sign-in
    description: 'Sign in through an upstream OpenID Connect identity provider (Google, Okta, Entra, ...): the provider list, and the start and callback browser redirects'
  - name: OAuth2/OIDC - Tokens
    description: Token management endpoints (issue, introspect, revoke)
  - name: OAuth2/OIDC - TOTP
    description: TOTP two-factor authentication during OAuth flow
  - name: OAuth2/OIDC - User Info
    description: OpenID Connect UserInfo endpoints
  - name: OAuth2/OIDC - Session
    description: Session management and logout endpoints
  - name: OAuth2/OIDC - Permissions
    description: Permission checking endpoints for service-to-service calls
  - name: Well-Known
    description: Discovery and metadata endpoints
  - name: Account - Profile
    description: User profile, password, and photo management
  - name: Account - Sessions
    description: Session management and revocation
  - name: Account - TOTP
    description: TOTP management for user accounts
  - name: Account - Sign-in Methods
    description: The identity provider accounts a user has linked, and linking or unlinking one (core's own UI only)
  - name: Admin - Users
    description: Admin endpoints for managing users (CRUD operations)
  - name: Admin - User Identities
    description: Admin endpoints for a user's linked identity provider accounts and sign-in invites, and their lifecycle events
  - name: Admin - User Permissions
    description: Admin endpoints for viewing user permissions
  - name: Admin - User Sessions
    description: Admin endpoints for managing user sessions
  - name: Admin - User TOTP
    description: Admin endpoints for managing user TOTP settings
  - name: Admin - Clients
    description: Admin endpoints for managing OAuth clients
  - name: Admin - Roles
    description: Admin endpoints for managing roles (CRUD operations)
  - name: Admin - Role Users
    description: Admin endpoints for managing role users
  - name: Admin - Role Permissions
    description: Admin endpoints for managing role permissions
  - name: Admin - Permissions
    description: Admin endpoints for managing permissions
  - name: Admin - Organizations
    description: Admin endpoints for managing organizations (CRUD operations)
  - name: Admin - Organization Members
    description: Admin endpoints for managing organization memberships
  - name: Admin - Organization Member Roles
    description: Admin endpoints for managing org-scoped role assignments
  - name: Admin - Identity Providers
    description: Admin endpoints for upstream identity providers and their lifecycle events
  - name: Admin - Identity Provider Domains
    description: Admin endpoints for the email domains a provider claims — organization, default roles, auto-accept and SSO-only
  - name: Admin - Settings
    description: Admin endpoints for system settings
  - name: Admin - Services
    description: Admin endpoints for app services — credentials, activation and access approval
  - name: Setup
    description: First-boot setup — create the first admin (public; authorized by the setup token)
  - name: Health
    description: System health check

  # Files
  - name: Files - Buckets
    description: Bucket management (create, list, update, delete)
  - name: Files - Objects
    description: |
      Object storage operations. Reads (list, download, HEAD) and uploads are
      key-addressed under `/v1/files/buckets/{name}/objects/*objectKey`. Mutations
      (rename, metadata update, delete, presign, version list / get / restore
      / delete) are id-addressed under
      `/v1/files/buckets/{name}/objects/by-id/{id}/...` — the `id` is a stable UUIDv7
      returned by the upload endpoint.
  - name: Files - Multipart
    description: |
      S3-style multipart upload lifecycle. All routes live under
      `/v1/files/buckets/{name}/multipart` — the object's destination key is sent in
      the initiate body so no path splat is needed.
  - name: Files - Archives
    description: |
      Folder-by-prefix or multi-select archive downloads. `POST
      /v1/files/buckets/{name}/archives` snapshots a bucket-scoped set of objects and
      returns a presigned URL that streams the zip/tar. The download URL is
      the only way to consume an archive — there is no authenticated-session
      shortcut, so the same flow serves both "download now" and "share a
      link".
  - name: Files - Permissions
    description: Bucket permission management (grant, revoke, list)
  - name: Files - Shares
    description: |
      DB-backed, revocable download links. Unlike stateless presigned URLs,
      shares persist as rows so they can be listed, revoked, password-
      protected, download-capped, or TTL-bounded. Supports single objects
      and server-built archives.
  - name: Files - Signed URLs
    description: |
      Endpoints that presigned URLs point at. They take no bearer token: the
      HMAC signature in the query string (`expires`, `nonce`, `v`, `sig`, and
      an optional `share`) is the authorization. URLs are minted by
      `POST /v1/files/buckets/{name}/objects/by-id/{id}/presign`,
      `POST /v1/files/buckets/{name}/archives` and `GET /v1/files/shared/{token}`; treat them
      as opaque and use them as returned.

  # Webhooks
  - name: Webhook Endpoints
    description: Webhook endpoint registration and management
  - name: Webhook Deliveries
    description: Webhook delivery tracking and inspection
  - name: Event Types
    description: The event type registry (read-only; services declare their event types, core in code and app services in provisioning documents)
  - name: Events
    description: Event emission to webhook endpoints
  - name: Webhook Events
    description: Outbound events delivered to subscribed webhook endpoints

  # Audit
  - name: Audit Log Entries
    description: Audit log entry management and querying

  # Notifications
  - name: Notifications
    description: Sending notifications and following their delivery
  - name: Admin - Notifications
    description: Notification channels and the connections (provider settings and sealed secrets) sends go through

