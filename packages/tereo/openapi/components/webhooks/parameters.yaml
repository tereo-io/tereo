WebhooksLimitParam:
  name: limit
  in: query
  description: Maximum number of items to return per page
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 25

WebhooksIdParam:
  name: id
  in: path
  required: true
  description: |
    Webhook endpoint id (a UUID; anything else is `400 invalid_request`). An
    endpoint that does not exist, or belongs to another organization than the
    one in effect, is `404`.
  schema:
    type: string
    format: uuid

EventTypeParam:
  name: eventType
  in: path
  required: true
  description: Event type identifier
  schema:
    type: string

DeliveryIdParam:
  name: deliveryId
  in: path
  required: true
  description: Webhook delivery unique identifier (a UUID; anything else is `400 invalid_request`)
  schema:
    type: string
    format: uuid

WebhooksFilterOperatorParam:
  name: filter[field_op]
  in: query
  description: |
    Filter operator. Replace `field` with the field name.
    Supported operators: `equals`, `contains` (case-insensitive), `in`
    (comma-separated values), and `gte` / `lte` for date ranges — which are
    usually written as their own keys, `filter[field_gte]` / `filter[field_lte]`.
    Defaults to `equals` if not specified. An operator or field the endpoint
    does not list is a 400.
  schema:
    type: string
    enum: [equals, contains, in, gte, lte]
    default: equals

WebhooksIncludeArchivedParam:
  name: includeArchived
  in: query
  description: |
    When `true`, include archived endpoints in the results. Defaults to `false` (archived
    endpoints hidden). Must be `true` or `false`; any other value is a `400 invalid_request`.
  required: false
  schema:
    type: string
    enum: ['true', 'false']
    default: 'false'

OrganizationIdHeader:
  name: X-Organization-ID
  in: header
  required: false
  description: |
    Act on another organization's webhook endpoints. Honoured only for callers
    with `webhooks.admin`, and ignored for anyone else (their token's `org_id`
    applies). Must be an existing organization's id: a malformed value is a
    400, an unknown one a 404.
  schema:
    type: string
    format: uuid
