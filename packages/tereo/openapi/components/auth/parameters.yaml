IncludeRetiredParam:
  name: includeRetired
  in: query
  description: |
    When `true`, retired rows (items their service no longer declares) are
    included in the results. Defaults to `false`. Must be `true` or `false`.
  required: false
  schema:
    type: string
    enum: ['true', 'false']
    default: 'false'

