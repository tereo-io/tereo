# Responses only this area uses; the shared ones are in ../responses.yaml

AccountForbiddenResponse:
  description: |
    Forbidden (`insufficient_scope`) - a delegated token whose core API
    scopes do not include `core:account`. `WWW-Authenticate` names the scope
    that would admit it. See `BearerAuth`.
  headers:
    WWW-Authenticate:
      description: '`Bearer error="insufficient_scope", scope="core:account"`'
      schema:
        type: string
    X-RateLimit-Limit:
      $ref: '../headers.yaml#/X-RateLimit-Limit'
    X-RateLimit-Remaining:
      $ref: '../headers.yaml#/X-RateLimit-Remaining'
    X-RateLimit-Reset:
      $ref: '../headers.yaml#/X-RateLimit-Reset'
  content:
    application/json:
      schema:
        type: object
        properties:
          error:
            type: string
            enum: [insufficient_scope]
          error_description:
            type: string
      example:
        error: "insufficient_scope"
        error_description: "This token's scopes do not reach /v1/account/me; it needs one of: core:account"

LoginTotpSetupForbiddenResponse:
  description: |
    Forbidden - `totp_disabled` while the system 2FA policy (`totpPolicy`)
    is `disabled`, or `access_denied` when the request carries core's
    credential cookies from an origin that may not act on them (see
    `CrossOriginRefusedResponse`).
  headers:
    X-RateLimit-Limit:
      $ref: '../headers.yaml#/X-RateLimit-Limit'
    X-RateLimit-Remaining:
      $ref: '../headers.yaml#/X-RateLimit-Remaining'
    X-RateLimit-Reset:
      $ref: '../headers.yaml#/X-RateLimit-Reset'
  content:
    application/json:
      schema:
        type: object
        properties:
          error:
            type: string
            enum: [totp_disabled, access_denied]
          error_description:
            type: string
      example:
        error: "totp_disabled"
        error_description: "Two-factor authentication is disabled by the system administrator."

CheckPermissionForbiddenResponse:
  description: |
    Forbidden - `forbidden` when the client may not ask about this user or
    organization (see the operation), or `access_denied` when the request
    carries core's credential cookies from an origin that may not act on them
    (see `CrossOriginRefusedResponse`).
  headers:
    X-RateLimit-Limit:
      $ref: '../headers.yaml#/X-RateLimit-Limit'
    X-RateLimit-Remaining:
      $ref: '../headers.yaml#/X-RateLimit-Remaining'
    X-RateLimit-Reset:
      $ref: '../headers.yaml#/X-RateLimit-Reset'
  content:
    application/json:
      schema:
        type: object
        properties:
          error:
            type: string
            enum: [forbidden, access_denied]
          error_description:
            type: string
      example:
        error: "forbidden"
        error_description: "This client may only ask about its own organization"

CrossOriginRefusedResponse:
  description: |
    Forbidden (`access_denied`) - the request uses a client's credential
    cookie but comes from a page that may not act for that client: neither
    core (`PUBLIC_URL`), the UI (`UI_BASE_URL`) nor an origin of the
    client's redirect URIs. See "Cookie-Authenticated Requests".
  headers:
    X-RateLimit-Limit:
      $ref: '../headers.yaml#/X-RateLimit-Limit'
    X-RateLimit-Remaining:
      $ref: '../headers.yaml#/X-RateLimit-Remaining'
    X-RateLimit-Reset:
      $ref: '../headers.yaml#/X-RateLimit-Reset'
  content:
    application/json:
      schema:
        type: object
        properties:
          error:
            type: string
            enum: [access_denied]
          error_description:
            type: string
      example:
        error: "access_denied"
        error_description: "Cross-origin request refused: this origin may not act on this client's session"

OAuth2ErrorResponse:
  description: |
    OAuth2 error response. The operation's description says which codes it
    returns with which status: client authentication failures are 401
    `invalid_client`, wrong credentials or codes 401 `access_denied` /
    `invalid_code`, everything else 400.
  headers:
    WWW-Authenticate:
      description: '`Basic realm="oauth"` on a 401 `invalid_client` (RFC 6749 §5.2)'
      schema:
        type: string
    Set-Cookie:
      description: Clears cookies where the operation says so — e.g. `trt_{client_id}` / `tsi_{client_id}` on a failed cookie-mode refresh at `POST /oauth/token`
      schema:
        type: string
    X-RateLimit-Limit:
      $ref: '../headers.yaml#/X-RateLimit-Limit'
    X-RateLimit-Remaining:
      $ref: '../headers.yaml#/X-RateLimit-Remaining'
    X-RateLimit-Reset:
      $ref: '../headers.yaml#/X-RateLimit-Reset'
  content:
    application/json:
      schema:
        type: object
        properties:
          error:
            description: OAuth2 error code
            type: string
            enum:
              - invalid_request
              - invalid_client
              - invalid_grant
              - unauthorized_client
              - unsupported_grant_type
              - invalid_scope
              - access_denied
              - invalid_session
              - session_expired
              - user_not_in_organization
              - organization_not_active
              - invalid_code
              - totp_not_configured
              - no_recovery_codes
              - invalid_setup_grant
              - invalid_setup_token
              - setup_expired
              - totp_already_enabled
              - interaction_required
          error_description:
            description: A human-readable explanation of the error
            type: string

ArchivedResponse:
  description: Conflict - the resource is archived; restore it before modifying it
  headers:
    X-RateLimit-Limit:
      $ref: '../headers.yaml#/X-RateLimit-Limit'
    X-RateLimit-Remaining:
      $ref: '../headers.yaml#/X-RateLimit-Remaining'
    X-RateLimit-Reset:
      $ref: '../headers.yaml#/X-RateLimit-Reset'
  content:
    application/json:
      schema:
        type: object
        properties:
          error:
            type: string
            enum:
              - resource_archived
          error_description:
            description: A human-readable explanation of the error
            type: string

UnprocessableEntityResponse:
  description: Unprocessable entity - the request is well-formed but cannot be applied
  headers:
    X-RateLimit-Limit:
      $ref: '../headers.yaml#/X-RateLimit-Limit'
    X-RateLimit-Remaining:
      $ref: '../headers.yaml#/X-RateLimit-Remaining'
    X-RateLimit-Reset:
      $ref: '../headers.yaml#/X-RateLimit-Reset'
  content:
    application/json:
      schema:
        type: object
        properties:
          error:
            description: A specific error code (e.g. `invalid_declaration`, `role_unavailable`)
            type: string
          error_description:
            description: A human-readable explanation of the error
            type: string

LinkForbiddenResponse:
  description: |
    Forbidden. `forbidden`: the token was not issued to core's own UI (a
    third-party client's `core:account` token may list linked accounts but
    never link or unlink one), or the user is not a person. `reauth_required`:
    the login is more than 10 minutes old; the UI signs the user in again with
    `max_age=0`, then retries. An insufficient `core:account` scope is
    `insufficient_scope`, as on every `/v1/account` route.
  headers:
    X-RateLimit-Limit:
      $ref: '../headers.yaml#/X-RateLimit-Limit'
    X-RateLimit-Remaining:
      $ref: '../headers.yaml#/X-RateLimit-Remaining'
    X-RateLimit-Reset:
      $ref: '../headers.yaml#/X-RateLimit-Reset'
  content:
    application/json:
      schema:
        type: object
        properties:
          error:
            type: string
            enum:
              - forbidden
              - reauth_required
              - insufficient_scope
          error_description:
            type: string
      example:
        error: reauth_required
        error_description: Sign in again to change how you sign in

IdentityConflictResponse:
  description: |
    Conflict. `last_sign_in_method`: the user has no password and no other
    linked identity at an active provider. `sso_required`: the user's email domain is
    `ssoOnly` for this identity's provider.
  headers:
    X-RateLimit-Limit:
      $ref: '../headers.yaml#/X-RateLimit-Limit'
    X-RateLimit-Remaining:
      $ref: '../headers.yaml#/X-RateLimit-Remaining'
    X-RateLimit-Reset:
      $ref: '../headers.yaml#/X-RateLimit-Reset'
  content:
    application/json:
      schema:
        type: object
        properties:
          error:
            type: string
            enum:
              - last_sign_in_method
              - sso_required
          error_description:
            type: string
      example:
        error: last_sign_in_method
        error_description: This is the account's only way to sign in

BrandingBadRequestResponse:
  description: |
    Invalid request. `invalid_request` with `issues` naming each field: a value over its limit, an
    unknown colour variable, a colour outside the allowed grammar, a link that is not `https:`, more
    than 3 links, or an image `sha256` that no live uploaded image has, whose type the slot refuses
    or that is over the slot's limit. `invalid_branding_image`: an upload that is not an allowed image
    for its slot, or an SVG the sanitizer would change. `unknown_branding_image`: an image expired
    between the check and the save; upload it again. `file_upload_required`: no file in the upload.
    `user_inactive`: granting to a deactivated user. `unknown_user`: a grantee that does not exist.
  headers:
    X-RateLimit-Limit:
      $ref: '../headers.yaml#/X-RateLimit-Limit'
    X-RateLimit-Remaining:
      $ref: '../headers.yaml#/X-RateLimit-Remaining'
    X-RateLimit-Reset:
      $ref: '../headers.yaml#/X-RateLimit-Reset'
  content:
    application/json:
      schema:
        type: object
        properties:
          error:
            type: string
            enum:
              - invalid_request
              - invalid_branding_image
              - unknown_branding_image
              - file_upload_required
              - user_inactive
              - unknown_user
          error_description:
            type: string
          issues:
            description: On `invalid_request`, each failed check
            type: array
            items:
              type: object
              required: [path, message]
              properties:
                path:
                  type: string
                message:
                  type: string

BrandingConflictResponse:
  description: |
    Conflict. `managed_by_provisioning`: the profile is declared in a provisioning document, so it is
    read-only here for everyone; `provisionedFrom` names the document's file. `conflict`: the user
    already holds an active grant on the client.
  headers:
    X-RateLimit-Limit:
      $ref: '../headers.yaml#/X-RateLimit-Limit'
    X-RateLimit-Remaining:
      $ref: '../headers.yaml#/X-RateLimit-Remaining'
    X-RateLimit-Reset:
      $ref: '../headers.yaml#/X-RateLimit-Reset'
  content:
    application/json:
      schema:
        type: object
        properties:
          error:
            type: string
            enum:
              - managed_by_provisioning
              - conflict
          error_description:
            type: string
          provisionedFrom:
            description: On `managed_by_provisioning`, the provisioning document's file name
            type: string
      example:
        error: managed_by_provisioning
        error_description: Managed by the provisioning file; change it there and restart core
        provisionedFrom: acme.json

BrandingPayloadTooLargeResponse:
  description: The image is over the slot's limit (`BRANDING_IMAGE_MAX_SIZE_KB` or `BRANDING_BACKGROUND_MAX_SIZE_MB`), or the multipart body has too many parts or a field over 1 KB
  headers:
    X-RateLimit-Limit:
      $ref: '../headers.yaml#/X-RateLimit-Limit'
    X-RateLimit-Remaining:
      $ref: '../headers.yaml#/X-RateLimit-Remaining'
    X-RateLimit-Reset:
      $ref: '../headers.yaml#/X-RateLimit-Reset'
  content:
    application/json:
      schema:
        type: object
        properties:
          error:
            type: string
            enum: [payload_too_large]
          error_description:
            type: string
