Retry-After:
  description: Seconds to wait before retrying
  schema:
    type: integer
  example: 1

X-RateLimit-Limit:
  description: The maximum number of requests allowed per window
  schema:
    type: integer
  example: 100

X-RateLimit-Remaining:
  description: The number of requests remaining in the current window
  schema:
    type: integer
  example: 95

X-RateLimit-Reset:
  description: ISO 8601 timestamp when the rate limit window resets
  schema:
    type: string
    format: date-time
  example: "2026-02-25T10:30:01.000Z"
