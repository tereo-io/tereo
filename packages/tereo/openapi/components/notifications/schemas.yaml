NotificationChannel:
  type: string
  enum: [email]

NotificationConnection:
  type: object
  description: |
    A named, configured way to reach a provider on one channel. The sealed secrets are never
    returned; `hasSecrets` says whether any are stored.
  required:
    - id
    - channel
    - slug
    - displayName
    - isDefault
    - isEnabled
    - settings
    - hasSecrets
    - maxPerMinute
    - createdBy
    - updatedBy
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      format: uuid
    channel:
      $ref: '#/NotificationChannel'
    slug:
      description: Unique per channel. Fixed once created.
      type: string
      maxLength: 50
      pattern: '^[a-z0-9-]+$'
    displayName:
      type: string
      maxLength: 100
    isDefault:
      description: The channel's default connection, used when a send names none. One per channel.
      type: boolean
    isEnabled:
      type: boolean
    settings:
      description: Non-secret settings, shaped by the channel (see `GET /v1/admin/notifications/channels`).
      type: object
      additionalProperties: true
    hasSecrets:
      type: boolean
    maxPerMinute:
      description: Send limit per minute, or null for none.
      type: [integer, 'null']
    createdBy:
      type: string
      format: uuid
    updatedBy:
      type: string
      format: uuid
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

ListNotificationConnectionsResponse:
  type: object
  required: [data]
  properties:
    data:
      type: array
      items:
        $ref: '#/NotificationConnection'

CreateNotificationConnectionRequest:
  type: object
  additionalProperties: false
  required: [channel, slug, displayName, settings]
  properties:
    channel:
      $ref: '#/NotificationChannel'
    slug:
      type: string
      minLength: 1
      maxLength: 50
      pattern: '^[a-z0-9-]+$'
    displayName:
      type: string
      minLength: 1
      maxLength: 100
    settings:
      description: Validated against the channel's settings schema.
      type: object
      additionalProperties: true
    secrets:
      description: Validated against the channel's secrets schema, then sealed. Write-only.
      type: object
      additionalProperties: true
    isEnabled:
      description: Defaults to true.
      type: boolean
    maxPerMinute:
      type: [integer, 'null']
      minimum: 1
      maximum: 1000000

UpdateNotificationConnectionRequest:
  type: object
  additionalProperties: false
  description: |
    Fields left out keep their value. `settings` replaces the whole object. `secrets` replaces the
    stored secrets, and `null` clears them. The slug and channel cannot change.
  properties:
    displayName:
      type: string
      minLength: 1
      maxLength: 100
    settings:
      type: object
      additionalProperties: true
    secrets:
      type: [object, 'null']
      additionalProperties: true
    isEnabled:
      type: boolean
    maxPerMinute:
      type: [integer, 'null']
      minimum: 1
      maximum: 1000000

TestNotificationConnectionRequest:
  type: object
  required: [to]
  properties:
    to:
      description: The address (for email) the test message goes to.
      type: string
      format: email
      maxLength: 320

TestNotificationConnectionResponse:
  description: |
    The provider's answer. A refusal is a 200 with `ok: false`, not an error status.
  oneOf:
    - type: object
      required: [ok, providerResponse]
      properties:
        ok:
          const: true
        providerResponse:
          type: [string, 'null']
    - type: object
      required: [ok, error]
      properties:
        ok:
          const: false
        error:
          type: string

NotificationChannelInfo:
  type: object
  required: [channel, settingsSchema, secretsSchema]
  properties:
    channel:
      $ref: '#/NotificationChannel'
    settingsSchema:
      description: JSON Schema of a connection's `settings` on this channel.
      type: object
      additionalProperties: true
    secretsSchema:
      description: JSON Schema of a connection's `secrets` on this channel.
      type: object
      additionalProperties: true

ListNotificationChannelsResponse:
  type: object
  required: [data]
  properties:
    data:
      type: array
      items:
        $ref: '#/NotificationChannelInfo'

NotificationConnectionEventData:
  type: object
  required: [id, channel, slug, displayName, isDefault, isEnabled]
  properties:
    id:
      type: string
      format: uuid
    channel:
      $ref: '#/NotificationChannel'
    slug:
      type: string
    displayName:
      type: string
    isDefault:
      type: boolean
    isEnabled:
      type: boolean

NotificationRecipient:
  type: object
  description: |
    Exactly one of `address` and `userId`, with the channel's per-recipient options. A user
    resolves to their account's email address.
  properties:
    address:
      type: string
      format: email
      maxLength: 320
    userId:
      type: string
      format: uuid
    as:
      description: 'Email: the header the recipient goes in.'
      type: string
      enum: [to, cc, bcc]
      default: to
  additionalProperties: true

EmailNotificationContent:
  type: object
  required: [subject]
  description: At least one of `text` and `html`.
  properties:
    subject:
      type: string
      minLength: 1
      maxLength: 998
    text:
      type: string
      minLength: 1
    html:
      type: string
      minLength: 1
    from:
      description: Defaults to the connection's `defaultFrom`. Must be an allowed sender.
      type: object
      required: [address]
      properties:
        address:
          type: string
          format: email
          maxLength: 320
        name:
          description: Must not contain line breaks, `<`, `>`, `@` or `"`.
          type: string
          minLength: 1
          maxLength: 200
    replyTo:
      description: Must be an allowed sender of the connection, like `from`.
      type: string
      format: email
      maxLength: 320

NotificationAttachmentRequest:
  type: object
  required: [bucket, objectId, versionId]
  properties:
    bucket:
      type: string
      minLength: 1
      maxLength: 255
    objectId:
      type: string
      format: uuid
    versionId:
      type: string
      format: uuid
    filename:
      description: Defaults to the last segment of the object's key. No line breaks.
      type: string
      minLength: 1
      maxLength: 255

NotificationAttachment:
  type: object
  required: [bucket, objectId, versionId, filename, contentType, size]
  properties:
    bucket:
      type: string
    objectId:
      type: string
      format: uuid
    versionId:
      type: string
      format: uuid
    filename:
      type: string
    contentType:
      type: string
    size:
      description: Bytes.
      type: integer

SendNotificationRequest:
  type: object
  required: [channel, recipients, content]
  additionalProperties: false
  properties:
    idempotencyKey:
      description: Makes a retry safe; kept for 24 hours per caller.
      type: string
      minLength: 1
      maxLength: 255
    channel:
      $ref: '#/NotificationChannel'
    connection:
      description: A connection's slug. Omitted, the channel's default at send time.
      type: string
      minLength: 1
      maxLength: 50
    organizationId:
      description: |
        Scopes the notification's audit entry and events; omitted or null, the token's
        organization, or the default organization for a token without one. A token with an organization may name only that one; a person's token
        without one may name none, nor may an integration's. `notifications.admin` and an app
        service's token without an organization may name any.
      type: [string, 'null']
      format: uuid
    recipients:
      type: array
      minItems: 1
      maxItems: 50
      items:
        $ref: '#/NotificationRecipient'
    content:
      description: Shaped by the channel; for email, `EmailNotificationContent`.
      $ref: '#/EmailNotificationContent'
    attachments:
      type: array
      maxItems: 50
      items:
        $ref: '#/NotificationAttachmentRequest'

SendNotificationResponse:
  type: object
  required: [id, status]
  properties:
    id:
      type: string
      format: uuid
    status:
      type: string
      enum: [pending]

NotificationDelivery:
  type: object
  description: One actual send. Email sends one per notification.
  required:
    - id
    - connectionId
    - recipients
    - status
    - attempts
    - lastError
    - providerMessageId
    - sentAt
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      format: uuid
    connectionId:
      description: The connection used, once sent.
      type: [string, 'null']
      format: uuid
    recipients:
      description: Resolved addresses with their options, and `userId` for a user recipient.
      type: array
      items:
        type: object
        required: [address]
        properties:
          address:
            type: string
          userId:
            type: string
            format: uuid
        additionalProperties: true
    status:
      type: string
      enum: [pending, sending, sent, failed]
    attempts:
      type: integer
    lastError:
      type: [string, 'null']
    providerMessageId:
      type: [string, 'null']
    sentAt:
      type: [string, 'null']
      format: date-time
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

Notification:
  type: object
  required:
    - id
    - channel
    - connectionId
    - senderUserId
    - organizationId
    - status
    - summary
    - recipients
    - attachments
    - createdAt
    - updatedAt
    - deliveries
  properties:
    id:
      type: string
      format: uuid
    channel:
      $ref: '#/NotificationChannel'
    connectionId:
      description: The named connection; null sends through the channel's default.
      type: [string, 'null']
      format: uuid
    senderUserId:
      type: string
      format: uuid
    organizationId:
      type: [string, 'null']
      format: uuid
    status:
      description: Rolled up from the deliveries.
      type: string
      enum: [pending, sent, partial, failed]
    summary:
      description: |
        A one-line description of the content from the channel (for email, the subject),
        kept after the content is dropped.
      type: [string, 'null']
      maxLength: 998
    recipients:
      description: As requested.
      type: array
      items:
        $ref: '#/NotificationRecipient'
    attachments:
      type: array
      items:
        $ref: '#/NotificationAttachment'
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    deliveries:
      type: array
      items:
        $ref: '#/NotificationDelivery'

NotificationLogEntry:
  type: object
  description: One send in the log. The message content is left out; the detail has it.
  required:
    - id
    - channel
    - connectionId
    - senderUserId
    - sender
    - organizationId
    - status
    - summary
    - recipients
    - attachments
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      format: uuid
    channel:
      $ref: '#/NotificationChannel'
    connectionId:
      type: [string, 'null']
      format: uuid
    senderUserId:
      type: string
      format: uuid
    sender:
      description: The user `senderUserId` names.
      $ref: '../schemas.yaml#/UserRef'
    organizationId:
      type: [string, 'null']
      format: uuid
    status:
      type: string
      enum: [pending, sent, partial, failed]
    summary:
      description: |
        A one-line description of the content from the channel (for email, the subject),
        kept after the content is dropped.
      type: [string, 'null']
      maxLength: 998
    recipients:
      type: array
      items:
        $ref: '#/NotificationRecipient'
    attachments:
      type: array
      items:
        $ref: '#/NotificationAttachment'
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

NotificationLogListItem:
  description: A log entry as the list shows it.
  allOf:
    - $ref: '#/NotificationLogEntry'
    - type: object
      required: [sentAt]
      properties:
        sentAt:
          description: When the most recently sent delivery went out; null until one has.
          type: [string, 'null']
          format: date-time

ListNotificationLogResponse:
  type: object
  required: [data, hasMore, limit, nextCursor]
  properties:
    data:
      type: array
      items:
        $ref: '#/NotificationLogListItem'
    hasMore:
      type: boolean
    limit:
      type: integer
    nextCursor:
      type: [string, 'null']

NotificationLogDelivery:
  description: A delivery with the provider's reply, as the log shows it.
  allOf:
    - $ref: '#/NotificationDelivery'
    - type: object
      required: [providerResponse]
      properties:
        providerResponse:
          description: The provider's last reply (an SMTP reply line for email).
          type: [string, 'null']

NotificationLogDetail:
  description: A send with its deliveries and, while any delivery is unsent, its content.
  allOf:
    - $ref: '#/NotificationLogEntry'
    - type: object
      required: [content, deliveries]
      properties:
        content:
          description: |
            What was sent, as the channel takes it (for email: `subject`, `text`, `html`, `from`,
            `replyTo`). Null once every delivery is sent.
          type: [object, 'null']
          additionalProperties: true
        deliveries:
          type: array
          items:
            $ref: '#/NotificationLogDelivery'

RetryNotificationResponse:
  type: object
  required: [requeued]
  properties:
    requeued:
      description: How many failed deliveries were put back to pending.
      type: integer
      minimum: 1

NotificationDeliveryEventData:
  type: object
  description: |
    `data` of `notification.sent` and `notification.failed`, one event per delivery.
  required: [id, channel, deliveryId, status, connection]
  properties:
    id:
      description: The notification.
      type: string
      format: uuid
    channel:
      $ref: '#/NotificationChannel'
    deliveryId:
      type: string
      format: uuid
    status:
      description: The notification's rolled-up status once this delivery settled.
      type: string
      enum: [pending, sent, partial, failed]
    connection:
      description: |
        Slug of the connection the delivery went through. Null only for a delivery failed for
        running out of attempts before any connection was used.
      type: [string, 'null']
