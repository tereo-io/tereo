      - Files - Multipart
    summary: Multipart upload completed
    description: |-
      Fired by `POST /v1/files/buckets/{name}/multipart/{uploadId}/complete`. `entityId` is the upload id. The resulting object also fires `file-service.object.created` / `.updated` (with `via: multipart`), and `file-service.object.version.created` in a versioned bucket.

      Only emitted for buckets that belong to an organization.
    operationId: webhookFilesMultipartCompleted
    security: []
    parameters:
      - $ref: '../../components/parameters.yaml#/WebhookIdHeader'
      - $ref: '../../components/parameters.yaml#/WebhookEventHeader'
      - $ref: '../../components/parameters.yaml#/WebhookTimestampHeader'
      - $ref: '../../components/parameters.yaml#/WebhookSignatureHeader'
