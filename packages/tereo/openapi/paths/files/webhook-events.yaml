file-service.lifecycle.policy.applied:
  post:
    tags:
      - Files - Buckets
    summary: Lifecycle policy applied
    description: |-
      Fired by the worker's lifecycle sweep, once per bucket per stage per batch that processed anything. `entityId` is the bucket's integer id.

      Only emitted for buckets that belong to an organization.
    operationId: webhookFilesLifecyclePolicyApplied
    security: []
    parameters:
      - $ref: '../../components/parameters.yaml#/WebhookIdHeader'
      - $ref: '../../components/parameters.yaml#/WebhookEventHeader'
      - $ref: '../../components/parameters.yaml#/WebhookTimestampHeader'
      - $ref: '../../components/parameters.yaml#/WebhookSignatureHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/webhook-schemas.yaml#/OrganizationWebhookEvent'
              - type: object
                properties:
                  eventType:
                    type: string
                    enum:
                      - file-service.lifecycle.policy.applied
                  entityType:
                    type: string
                    enum:
                      - bucket
                  data:
                    type: object
                    properties:
                      bucketId:
                        type: integer
                        description: The bucket's integer id.
                      bucketName:
                        type: string
                      stage:
                        type: string
                        enum:
                          - expireObjects
                          - expireVersions
                          - purgeSoftDeleted
                          - perObjectTtl
                      processed:
                        type: integer
                        description: Number of entities in `entityIds`.
                      entityType:
                        type: string
                        enum:
                          - object
                          - objectVersion
                      entityIds:
                        type: array
                        items:
                          type: string
                          format: uuid
                      pendingCleanup:
                        type: boolean
                        deprecated: true
                        description: Always false. The event is written in the batch's transaction, before storage reclaim is queued; a failed enqueue is picked up by the hourly orphan backstop.
                    required:
                      - bucketId
                      - bucketName
                      - stage
                      - processed
                      - entityType
                      - entityIds
                      - pendingCleanup
    responses:
      2XX:
        description: Any 2xx marks the delivery successful; anything else is retried with exponential backoff.

