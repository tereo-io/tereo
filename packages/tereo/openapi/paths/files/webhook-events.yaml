              - type: object
                properties:
                  eventType:
                    type: string
                    enum:
                      - file-service.multipart.completed
                  entityType:
                    type: string
                    enum:
                      - multipartUpload
                  data:
                    type: object
                    properties:
                      bucketName:
                        type: string
                      objectKey:
                        type: string
                      contentType:
                        type: string
                      sizeBytes:
                        type: string
                        pattern: ^[0-9]+$
                        description: Plaintext size in bytes, as a decimal string.
                      etag:
                        type: string
                      objectId:
                        type: string
                        format: uuid
                        description: The object the upload wrote.
                    required:
                      - bucketName
                      - objectKey
                      - contentType
                      - sizeBytes
                      - etag
                      - objectId
