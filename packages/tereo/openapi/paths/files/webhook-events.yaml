# Outbound webhook events of the files area, referenced from the root `webhooks:`.
# Event types: src/definitions/eventTypes.ts; payloads: the emitTx(...) call sites.

file-service.bucket.created:
  post:
    tags:
      - Files - Buckets
    summary: Bucket created
    description: |-
      Fired by `POST /v1/files/buckets`. `entityId` is the bucket's integer id.

      Only emitted for buckets that belong to an organization.
    operationId: webhookFilesBucketCreated
    security: []
    parameters:
      - $ref: '../../components/parameters.yaml#/WebhookIdHeader'
      - $ref: '../../components/parameters.yaml#/WebhookEventHeader'
      - $ref: '../../components/parameters.yaml#/WebhookTimestampHeader'
      - $ref: '../../components/parameters.yaml#/WebhookSignatureHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/webhook-schemas.yaml#/OrganizationWebhookEvent'
              - type: object
                properties:
                  eventType:
                    type: string
                    enum:
                      - file-service.bucket.created
                  entityType:
                    type: string
                    enum:
                      - bucket
                  data:
                    type: object
                    properties:
                      bucketName:
                        type: string
                      policy:
                        type: string
                        enum:
                          - public
                          - private
                      versioningEnabled:
                        type: boolean
                    required:
                      - bucketName
                      - policy
                      - versioningEnabled
    responses:
      2XX:
        description: Any 2xx marks the delivery successful; anything else is retried with exponential backoff.

file-service.bucket.updated:
  post:
    tags:
      - Files - Buckets
    summary: Bucket updated
    description: |-
      Fired by `PUT /v1/files/buckets/{name}` when something changed; a call that changes nothing emits no event. `entityId` is the bucket's integer id.

      Only emitted for buckets that belong to an organization.
    operationId: webhookFilesBucketUpdated
    security: []
    parameters:
      - $ref: '../../components/parameters.yaml#/WebhookIdHeader'
      - $ref: '../../components/parameters.yaml#/WebhookEventHeader'
      - $ref: '../../components/parameters.yaml#/WebhookTimestampHeader'
      - $ref: '../../components/parameters.yaml#/WebhookSignatureHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/webhook-schemas.yaml#/OrganizationWebhookEvent'
              - type: object
                properties:
                  eventType:
                    type: string
                    enum:
                      - file-service.bucket.updated
                  entityType:
                    type: string
                    enum:
                      - bucket
                  data:
                    type: object
                    properties:
                      bucketName:
                        type: string
                    required:
                      - bucketName
    responses:
      2XX:
        description: Any 2xx marks the delivery successful; anything else is retried with exponential backoff.

file-service.bucket.owner-changed:
  post:
    tags:
      - Files - Buckets
    summary: Bucket ownership transferred
    description: |-
      Fired by `PUT /v1/files/buckets/{name}/owner` when the owner changes. `entityId` is the bucket's integer id.

      A new owner who held no active grant also gets one, emitted as `file-service.permission.granted`.

      Only emitted for buckets that belong to an organization.
    operationId: webhookFilesBucketOwnerChanged
    security: []
    parameters:
      - $ref: '../../components/parameters.yaml#/WebhookIdHeader'
      - $ref: '../../components/parameters.yaml#/WebhookEventHeader'
      - $ref: '../../components/parameters.yaml#/WebhookTimestampHeader'
      - $ref: '../../components/parameters.yaml#/WebhookSignatureHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/webhook-schemas.yaml#/OrganizationWebhookEvent'
              - type: object
                properties:
                  eventType:
                    type: string
                    enum:
                      - file-service.bucket.owner-changed
                  entityType:
                    type: string
                    enum:
                      - bucket
                  data:
                    type: object
                    properties:
                      bucketName:
                        type: string
                      ownerId:
                        type: string
                        format: uuid
                      previousOwnerId:
                        type: string
                        format: uuid
                    required:
                      - bucketName
                      - ownerId
                      - previousOwnerId
    responses:
      2XX:
        description: Any 2xx marks the delivery successful; anything else is retried with exponential backoff.

file-service.bucket.deleted:
  post:
    tags:
      - Files - Buckets
    summary: Bucket deleted
    description: |-
      Fired by `DELETE /v1/files/buckets/{name}` (soft delete). `entityId` is the bucket's integer id.

      Only emitted for buckets that belong to an organization.
    operationId: webhookFilesBucketDeleted
    security: []
    parameters:
      - $ref: '../../components/parameters.yaml#/WebhookIdHeader'
      - $ref: '../../components/parameters.yaml#/WebhookEventHeader'
      - $ref: '../../components/parameters.yaml#/WebhookTimestampHeader'
      - $ref: '../../components/parameters.yaml#/WebhookSignatureHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/webhook-schemas.yaml#/OrganizationWebhookEvent'
              - type: object
                properties:
                  eventType:
                    type: string
                    enum:
                      - file-service.bucket.deleted
                  entityType:
                    type: string
                    enum:
                      - bucket
                  data:
                    type: object
                    properties:
                      bucketName:
                        type: string
                    required:
                      - bucketName
    responses:
      2XX:
        description: Any 2xx marks the delivery successful; anything else is retried with exponential backoff.

file-service.object.created:
  post:
    tags:
      - Files - Objects
    summary: Object created
    description: |-
      Fired when an upload writes an object that did not exist before. `entityId` is the object id.

      Covers authenticated uploads, presigned uploads and completed multipart uploads; `data.via` says which.

      Only emitted for buckets that belong to an organization.
    operationId: webhookFilesObjectCreated
    security: []
    parameters:
      - $ref: '../../components/parameters.yaml#/WebhookIdHeader'
      - $ref: '../../components/parameters.yaml#/WebhookEventHeader'
      - $ref: '../../components/parameters.yaml#/WebhookTimestampHeader'
      - $ref: '../../components/parameters.yaml#/WebhookSignatureHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/webhook-schemas.yaml#/OrganizationWebhookEvent'
              - type: object
                properties:
                  eventType:
                    type: string
                    enum:
                      - file-service.object.created
                  entityType:
                    type: string
                    enum:
                      - object
                  data:
                    type: object
                    properties:
                      bucketName:
                        type: string
                      objectKey:
                        type: string
                      contentType:
                        type: string
                      sizeBytes:
                        type: string
                        pattern: ^[0-9]+$
                        description: Plaintext size in bytes, as a decimal string.
                      etag:
                        type: string
                        description: MD5 of the content (hex); `<md5>-<parts>` for multipart uploads.
                      tags:
                        type: array
                        items:
                          type: string
                      via:
                        type: string
                        enum:
                          - direct
                          - presigned
                          - multipart
                        description: '`direct` is `PUT /v1/files/buckets/{name}/objects/{objectKey}`, `presigned` is `PUT /v1/files/signed/objects/{bucket}/by-id/{id}`, `multipart` is `POST /v1/files/buckets/{name}/multipart/{uploadId}/complete`.'
                    required:
                      - bucketName
                      - objectKey
                      - contentType
                      - sizeBytes
                      - etag
                      - tags
                      - via
    responses:
      2XX:
        description: Any 2xx marks the delivery successful; anything else is retried with exponential backoff.

file-service.object.updated:
  post:
    tags:
      - Files - Objects
    summary: Object updated
    description: |-
      Fired when an upload (authenticated, presigned or multipart) overwrites an existing object, on every `PATCH /v1/files/buckets/{name}/objects/by-id/{id}` (rename, metadata, tags, content type or `deleteAfter`), and when a version restore undeletes a deleted object (alongside `file-service.object.version.restored`). `entityId` is the object id.

      The `data` shape depends on the path that fired it.

      Only emitted for buckets that belong to an organization.
    operationId: webhookFilesObjectUpdated
    security: []
    parameters:
      - $ref: '../../components/parameters.yaml#/WebhookIdHeader'
      - $ref: '../../components/parameters.yaml#/WebhookEventHeader'
      - $ref: '../../components/parameters.yaml#/WebhookTimestampHeader'
      - $ref: '../../components/parameters.yaml#/WebhookSignatureHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/webhook-schemas.yaml#/OrganizationWebhookEvent'
              - type: object
                properties:
                  eventType:
                    type: string
                    enum:
                      - file-service.object.updated
                  entityType:
                    type: string
                    enum:
                      - object
                  data:
                    anyOf:
                      - type: object
                        description: Content write — an authenticated upload, a presigned upload, or a completed multipart upload.
                        properties:
                          bucketName:
                            type: string
                          objectKey:
                            type: string
                          contentType:
                            type: string
                          sizeBytes:
                            type: string
                            pattern: ^[0-9]+$
                            description: Plaintext size in bytes, as a decimal string.
                          etag:
                            type: string
                            description: MD5 of the content (hex); `<md5>-<parts>` for multipart uploads.
                          tags:
                            type: array
                            items:
                              type: string
                          via:
                            type: string
                            enum:
                              - direct
                              - presigned
                              - multipart
                            description: '`direct` is `PUT /v1/files/buckets/{name}/objects/{objectKey}`, `presigned` is `PUT /v1/files/signed/objects/{bucket}/by-id/{id}`, `multipart` is `POST /v1/files/buckets/{name}/multipart/{uploadId}/complete`.'
                        required:
                          - bucketName
                          - objectKey
                          - contentType
                          - sizeBytes
                          - etag
                          - tags
                          - via
                      - type: object
                        description: '`PATCH /v1/files/buckets/{name}/objects/by-id/{id}` — rename, metadata/tags/content-type change, or a `deleteAfter`-only change.'
                        properties:
                          bucketName:
                            type: string
                          objectKey:
                            type: string
                            description: The object's key after the change.
                          objectId:
                            type: string
                            format: uuid
                          renamed:
                            oneOf:
                              - type: object
                                properties:
                                  previousKey:
                                    type: string
                                  newKey:
                                    type: string
                                required:
                                  - previousKey
                                  - newKey
                              - type: 'null'
                            description: Set when the PATCH renamed the object.
                          branchedVersion:
                            type: boolean
                            description: Whether a metadata change created a new version (versioned buckets with `createNewVersion`).
                        required:
                          - bucketName
                          - objectKey
                          - objectId
                          - renamed
                          - branchedVersion
                      - type: object
                        description: '`POST /v1/files/buckets/{name}/objects/by-id/{id}/versions/{versionId}/restore` that undeleted the object — its restored content.'
                        properties:
                          bucketName:
                            type: string
                          objectKey:
                            type: string
                          objectId:
                            type: string
                            format: uuid
                          contentType:
                            type: string
                          sizeBytes:
                            type: string
                            pattern: ^[0-9]+$
                            description: Plaintext size in bytes, as a decimal string.
                          etag:
                            type: string
                          tags:
                            type: array
                            items:
                              type: string
                          via:
                            type: string
                            enum:
                              - restore
                          restoredFromVersionId:
                            type: string
                            format: uuid
                        required:
                          - bucketName
                          - objectKey
                          - objectId
                          - contentType
                          - sizeBytes
                          - etag
                          - tags
                          - via
                          - restoredFromVersionId
    responses:
      2XX:
        description: Any 2xx marks the delivery successful; anything else is retried with exponential backoff.

file-service.object.deleted:
  post:
    tags:
      - Files - Objects
    summary: Object deleted
    description: |-
      Fired by `DELETE /v1/files/buckets/{name}/objects/by-id/{id}` (soft delete, or a delete marker in a versioned bucket). `entityId` is the object id.

      Only emitted for buckets that belong to an organization.
    operationId: webhookFilesObjectDeleted
    security: []
    parameters:
      - $ref: '../../components/parameters.yaml#/WebhookIdHeader'
      - $ref: '../../components/parameters.yaml#/WebhookEventHeader'
      - $ref: '../../components/parameters.yaml#/WebhookTimestampHeader'
      - $ref: '../../components/parameters.yaml#/WebhookSignatureHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/webhook-schemas.yaml#/OrganizationWebhookEvent'
              - type: object
                properties:
                  eventType:
                    type: string
                    enum:
                      - file-service.object.deleted
                  entityType:
                    type: string
                    enum:
                      - object
                  data:
                    type: object
                    properties:
                      bucketName:
                        type: string
                      objectKey:
                        type: string
                      objectId:
                        type: string
                        format: uuid
                      versionedTombstone:
                        type: boolean
                        description: True when the bucket is versioned and a delete marker was written.
                    required:
                      - bucketName
                      - objectKey
                      - objectId
                      - versionedTombstone
    responses:
      2XX:
        description: Any 2xx marks the delivery successful; anything else is retried with exponential backoff.

file-service.objects.bulk-deleted:
  post:
    tags:
      - Files - Objects
    summary: Objects bulk-deleted
    description: |-
      Fired once per `POST /v1/files/buckets/{name}/objects/bulk-delete`; no per-object events are emitted. `entityId` is the bucket's integer id.

      Only emitted for buckets that belong to an organization.
    operationId: webhookFilesObjectsBulkDeleted
    security: []
    parameters:
      - $ref: '../../components/parameters.yaml#/WebhookIdHeader'
      - $ref: '../../components/parameters.yaml#/WebhookEventHeader'
      - $ref: '../../components/parameters.yaml#/WebhookTimestampHeader'
      - $ref: '../../components/parameters.yaml#/WebhookSignatureHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/webhook-schemas.yaml#/OrganizationWebhookEvent'
              - type: object
                properties:
                  eventType:
                    type: string
                    enum:
                      - file-service.objects.bulk-deleted
                  entityType:
                    type: string
                    enum:
                      - bucket
                  data:
                    type: object
                    properties:
                      bucketName:
                        type: string
                      filter:
                        oneOf:
                          - type: object
                            properties:
                              kind:
                                type: string
                                enum:
                                  - prefix
                              prefix:
                                type: string
                            required:
                              - kind
                              - prefix
                          - type: object
                            properties:
                              kind:
                                type: string
                                enum:
                                  - ids
                              ids:
                                type: array
                                items:
                                  type: string
                                  format: uuid
                            required:
                              - kind
                              - ids
                        description: The request's selector.
                      deletedCount:
                        type: integer
                      truncated:
                        type: boolean
                        description: True when the per-request cap stopped the delete early.
                      versionedTombstone:
                        type: boolean
                      objects:
                        type: array
                        maxItems: 100
                        description: The first 100 deleted objects; use `deletedCount` for the total.
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            objectKey:
                              type: string
                          required:
                            - id
                            - objectKey
                    required:
                      - bucketName
                      - filter
                      - deletedCount
                      - truncated
                      - versionedTombstone
                      - objects
    responses:
      2XX:
        description: Any 2xx marks the delivery successful; anything else is retried with exponential backoff.

file-service.object.version.created:
  post:
    tags:
      - Files - Objects
    summary: Object version created
    description: |-
      Fired in a versioning-enabled bucket for every new version a write creates: each upload (authenticated, presigned or multipart, alongside `file-service.object.created` / `.updated`) and `PATCH /v1/files/buckets/{name}/objects/by-id/{id}` with `createNewVersion`. `entityId` is the new version's id. Restores fire `file-service.object.version.restored` instead; delete markers fire `file-service.object.deleted`.

      Only emitted for buckets that belong to an organization.
    operationId: webhookFilesObjectVersionCreated
    security: []
    parameters:
      - $ref: '../../components/parameters.yaml#/WebhookIdHeader'
      - $ref: '../../components/parameters.yaml#/WebhookEventHeader'
      - $ref: '../../components/parameters.yaml#/WebhookTimestampHeader'
      - $ref: '../../components/parameters.yaml#/WebhookSignatureHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/webhook-schemas.yaml#/OrganizationWebhookEvent'
              - type: object
                properties:
                  eventType:
                    type: string
                    enum:
                      - file-service.object.version.created
                  entityType:
                    type: string
                    enum:
                      - objectVersion
                  data:
                    type: object
                    properties:
                      bucketName:
                        type: string
                      objectKey:
                        type: string
                      objectId:
                        type: string
                        format: uuid
                      versionId:
                        type: string
                        format: uuid
                      contentType:
                        type:
                          - string
                          - 'null'
                      sizeBytes:
                        type:
                          - string
                          - 'null'
                        pattern: ^[0-9]+$
                        description: Plaintext size in bytes, as a decimal string.
                      etag:
                        type:
                          - string
                          - 'null'
                      via:
                        type: string
                        enum:
                          - direct
                          - presigned
                          - multipart
                          - metadata
                        description: The write that created the version; `metadata` is a `PATCH` with `createNewVersion`.
                    required:
                      - bucketName
                      - objectKey
                      - objectId
                      - versionId
                      - contentType
                      - sizeBytes
                      - etag
                      - via
    responses:
      2XX:
        description: Any 2xx marks the delivery successful; anything else is retried with exponential backoff.

file-service.object.version.restored:
  post:
    tags:
      - Files - Objects
    summary: Object version restored
    description: |-
      Fired by `POST /v1/files/buckets/{name}/objects/by-id/{id}/versions/{versionId}/restore`, including a restore that undeletes a deleted object. `entityId` is the id of the new current version created by the restore.

      Only emitted for buckets that belong to an organization.
    operationId: webhookFilesObjectVersionRestored
    security: []
    parameters:
      - $ref: '../../components/parameters.yaml#/WebhookIdHeader'
      - $ref: '../../components/parameters.yaml#/WebhookEventHeader'
      - $ref: '../../components/parameters.yaml#/WebhookTimestampHeader'
      - $ref: '../../components/parameters.yaml#/WebhookSignatureHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/webhook-schemas.yaml#/OrganizationWebhookEvent'
              - type: object
                properties:
                  eventType:
                    type: string
                    enum:
                      - file-service.object.version.restored
                  entityType:
                    type: string
                    enum:
                      - objectVersion
                  data:
                    type: object
                    properties:
                      bucketName:
                        type: string
                      objectKey:
                        type: string
                      objectId:
                        type: string
                        format: uuid
                      restoredFromVersionId:
                        type: string
                        format: uuid
                        description: The version that was restored.
                      undeleted:
                        type: boolean
                        description: True when the object had been deleted and the restore brought it back.
                    required:
                      - bucketName
                      - objectKey
                      - objectId
                      - restoredFromVersionId
                      - undeleted
    responses:
      2XX:
        description: Any 2xx marks the delivery successful; anything else is retried with exponential backoff.

file-service.object.version.deleted:
  post:
    tags:
      - Files - Objects
    summary: Object version deleted
    description: |-
      Fired by `DELETE /v1/files/buckets/{name}/objects/by-id/{id}/versions/{versionId}`. `entityId` is the deleted version's id.

      Only emitted for buckets that belong to an organization.
    operationId: webhookFilesObjectVersionDeleted
    security: []
    parameters:
      - $ref: '../../components/parameters.yaml#/WebhookIdHeader'
      - $ref: '../../components/parameters.yaml#/WebhookEventHeader'
      - $ref: '../../components/parameters.yaml#/WebhookTimestampHeader'
      - $ref: '../../components/parameters.yaml#/WebhookSignatureHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/webhook-schemas.yaml#/OrganizationWebhookEvent'
              - type: object
                properties:
                  eventType:
                    type: string
                    enum:
                      - file-service.object.version.deleted
                  entityType:
                    type: string
                    enum:
                      - objectVersion
                  data:
                    type: object
                    properties:
                      bucketName:
                        type: string
                      objectKey:
                        type: string
                      objectId:
                        type: string
                        format: uuid
                    required:
                      - bucketName
                      - objectKey
                      - objectId
    responses:
      2XX:
        description: Any 2xx marks the delivery successful; anything else is retried with exponential backoff.

file-service.objects.versions.purged:
  post:
    tags:
      - Files - Objects
    summary: Non-current versions purged
    description: |-
      Fired once per `POST /v1/files/buckets/{name}/objects/purge-non-current-versions`. `entityId` is the bucket's integer id.

      Only emitted for buckets that belong to an organization.
    operationId: webhookFilesObjectsVersionsPurged
    security: []
    parameters:
      - $ref: '../../components/parameters.yaml#/WebhookIdHeader'
      - $ref: '../../components/parameters.yaml#/WebhookEventHeader'
      - $ref: '../../components/parameters.yaml#/WebhookTimestampHeader'
      - $ref: '../../components/parameters.yaml#/WebhookSignatureHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/webhook-schemas.yaml#/OrganizationWebhookEvent'
              - type: object
                properties:
                  eventType:
                    type: string
                    enum:
                      - file-service.objects.versions.purged
                  entityType:
                    type: string
                    enum:
                      - bucket
                  data:
                    type: object
                    properties:
                      bucketName:
                        type: string
                      purgedCount:
                        type: integer
                      bytesFreed:
                        type: string
                        pattern: ^[0-9]+$
                        description: Bytes released, as a decimal string.
                      truncated:
                        type: boolean
                    required:
                      - bucketName
                      - purgedCount
                      - bytesFreed
                      - truncated
    responses:
      2XX:
        description: Any 2xx marks the delivery successful; anything else is retried with exponential backoff.

file-service.permission.granted:
  post:
    tags:
      - Files - Permissions
    summary: Bucket permission granted
    description: |-
      Fired by `POST /v1/files/buckets/{name}/permissions`, including re-granting a previously revoked permission, by `POST /v1/files/buckets` for the creator's own grant (`canRead`, `canWrite` and `canDelete` all true, `grantedBy` the creator), and by `PUT /v1/files/buckets/{name}/owner` for a new owner without an active grant (all three true, `grantedBy` the admin). `entityId` is the permission's integer id.

      Only emitted for buckets that belong to an organization.
    operationId: webhookFilesPermissionGranted
    security: []
    parameters:
      - $ref: '../../components/parameters.yaml#/WebhookIdHeader'
      - $ref: '../../components/parameters.yaml#/WebhookEventHeader'
      - $ref: '../../components/parameters.yaml#/WebhookTimestampHeader'
      - $ref: '../../components/parameters.yaml#/WebhookSignatureHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/webhook-schemas.yaml#/OrganizationWebhookEvent'
              - type: object
                properties:
                  eventType:
                    type: string
                    enum:
                      - file-service.permission.granted
                  entityType:
                    type: string
                    enum:
                      - bucketPermission
                  data:
                    type: object
                    properties:
                      bucketName:
                        type: string
                      userId:
                        type: string
                        format: uuid
                        description: The user the permission was granted to.
                      canRead:
                        type: boolean
                      canWrite:
                        type: boolean
                      canDelete:
                        type: boolean
                      grantedBy:
                        type: string
                        format: uuid
                    required:
                      - bucketName
                      - userId
                      - canRead
                      - canWrite
                      - canDelete
                      - grantedBy
    responses:
      2XX:
        description: Any 2xx marks the delivery successful; anything else is retried with exponential backoff.

file-service.permission.revoked:
  post:
    tags:
      - Files - Permissions
    summary: Bucket permission revoked
    description: |-
      Fired by `DELETE /v1/files/buckets/{name}/permissions/{userId}`, and by `DELETE /v1/admin/organizations/{id}/members/{userId}` for each grant the removed member held on the organization's buckets. `entityId` is the permission's integer id.

      Only emitted for buckets that belong to an organization.
    operationId: webhookFilesPermissionRevoked
    security: []
    parameters:
