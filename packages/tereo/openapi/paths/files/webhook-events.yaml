              - $ref: '../../components/webhook-schemas.yaml#/OrganizationWebhookEvent'
              - type: object
                properties:
                  eventType:
                    type: string
                    enum:
                      - file-service.share.accessed
                  entityType:
                    type: string
                    enum:
                      - share
                  data:
                    type: object
                    properties:
                      bucketName:
                        type: string
                      kind:
                        type: string
                        enum:
                          - OBJECT
                          - ARCHIVE
                      unlocked:
                        type: boolean
                        description: True when the URL came from `POST /v1/files/shared/{token}/unlock` (including for a share without a password).
                    required:
                      - bucketName
                      - kind
                      - unlocked
    responses:
      2XX:
        description: Any 2xx marks the delivery successful; anything else is retried with exponential backoff.
