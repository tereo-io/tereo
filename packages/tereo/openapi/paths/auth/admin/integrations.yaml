core.integration.previous-secret-revoked:
  post:
    tags:
      - Admin - Integrations
    summary: Integration previous secret revoked
    description: Fired when an integration's previous client secret is revoked before its overlap ended.
    operationId: webhookIntegrationPreviousSecretRevoked
    security: []
    parameters:
      - $ref: '../../../components/parameters.yaml#/WebhookIdHeader'
      - $ref: '../../../components/parameters.yaml#/WebhookEventHeader'
      - $ref: '../../../components/parameters.yaml#/WebhookTimestampHeader'
      - $ref: '../../../components/parameters.yaml#/WebhookSignatureHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../../components/webhook-schemas.yaml#/OrganizationWebhookEvent'
              - type: object
                properties:
                  eventType:
                    const: core.integration.previous-secret-revoked
                  entityType:
                    const: Integration
                  data:
                    type: object
                    required: [id, slug]
                    properties:
                      id:
                        type: string
                        format: uuid
                      slug:
                        type: string
    responses:
      '2XX':
        description: Any 2xx response acknowledges the delivery; anything else is retried.
