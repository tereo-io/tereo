/admin/identity-providers:
  get:
    tags:
      - Admin - Identity Providers
    summary: List identity providers
    description: |
      Returns every identity provider, active or not, ordered by display name. The
      client secret is never returned.
    operationId: listAdminIdentityProviders
    security:
      - BearerAuth: [identity-providers.read]
    responses:
      '200':
        description: The identity providers
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../../../components/auth/schemas.yaml#/IdentityProvider'
      '401':
        $ref: '../../../components/responses.yaml#/UnauthorizedResponse'
      '403':
        $ref: '../../../components/responses.yaml#/ForbiddenResponse'
      '429':
        $ref: '../../../components/responses.yaml#/RateLimitResponse'
      '500':
        $ref: '../../../components/responses.yaml#/ServerErrorResponse'

  post:
    tags:
      - Admin - Identity Providers
    summary: Create an identity provider
    description: |
      Adds an upstream OpenID Connect provider users can sign in through. Core
      fetches the issuer's discovery document first: its `issuer` must equal the one
      given exactly (https, unless `OIDC_ALLOW_PRIVATE_ISSUERS`), and the provider
      must support `response_type=code`, PKCE `S256` and publish a `jwks_uri`.
      `scopes` defaults to `openid email profile` and must include `openid`. The
      client secret is sealed at rest and never returned. The response carries the
      `callbackUrl` to register at the provider. A new provider is active.

      Errors: 400 `reserved_slug` (`providers`), 400 `invalid_provider_config` (the
      discovery document or the scopes are unusable, or the issuer differs), 400
      `provider_unreachable` (a private address without `OIDC_ALLOW_PRIVATE_ISSUERS`,
      or discovery failed), 409 `slug_taken`.

      Setting `countsAsMfa` makes every login through the provider count as multi-factor
      everywhere (instance policy, `requires_2fa` roles, `acr_values`): enable it only
      for a provider whose own MFA you administer. Only a caller holding `admin` through
      a global role may set it (403 otherwise).

      An audit log entry is created for this action.
      An `auth.identity-provider.created` webhook event is emitted.
    operationId: createAdminIdentityProvider
    security:
      - BearerAuth: [identity-providers.write]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../../components/auth/schemas.yaml#/CreateIdentityProviderRequest'
    responses:
      '201':
        description: Identity provider created
        content:
          application/json:
            schema:
              $ref: '../../../components/auth/schemas.yaml#/IdentityProvider'
      '400':
        $ref: '../../../components/responses.yaml#/BadRequestResponse'
      '401':
        $ref: '../../../components/responses.yaml#/UnauthorizedResponse'
      '403':
        $ref: '../../../components/responses.yaml#/ForbiddenResponse'
      '409':
        $ref: '../../../components/responses.yaml#/ConflictResponse'
      '429':
        $ref: '../../../components/responses.yaml#/RateLimitResponse'
      '500':
        $ref: '../../../components/responses.yaml#/ServerErrorResponse'


/admin/identity-providers/{id}:
  get:
    tags:
      - Admin - Identity Providers
    summary: Get an identity provider
    description: |
      Returns one identity provider. The client secret is never returned.
    operationId: getAdminIdentityProvider
    security:
      - BearerAuth: [identity-providers.read]
    parameters:
      - $ref: '../../../components/auth/parameters.yaml#/IdentityProviderIdParam'
    responses:
      '200':
        description: The identity provider
        content:
          application/json:
            schema:
              $ref: '../../../components/auth/schemas.yaml#/IdentityProvider'
      '400':
        $ref: '../../../components/responses.yaml#/BadRequestResponse'
        description: Malformed id
      '401':
        $ref: '../../../components/responses.yaml#/UnauthorizedResponse'
      '403':
        $ref: '../../../components/responses.yaml#/ForbiddenResponse'
      '404':
        $ref: '../../../components/responses.yaml#/NotFoundResponse'
      '429':
        $ref: '../../../components/responses.yaml#/RateLimitResponse'
      '500':
        $ref: '../../../components/responses.yaml#/ServerErrorResponse'

  patch:
    tags:
      - Admin - Identity Providers
    summary: Update an identity provider
    description: |
      Changes only the fields sent. Omitting `clientSecret` keeps the stored one,
      except that a new `issuer` or `clientId` needs a new `clientSecret` in the same
      request (400 `client_secret_required`): the stored secret is never sent to a
      different issuer or client. Sending a field's current value is no change.
      When `issuer`, `clientId`, `clientSecret` or `scopes` change, the resulting
      configuration is validated against the issuer as on create. Core drops its
      cached discovery metadata for the provider on every process.

      `slug` cannot change once any user has linked an identity (409 `slug_in_use`),
      because the callback URL is registered at the provider; a taken or reserved slug
      is 409 `slug_taken` / 400 `reserved_slug`. `issuer` cannot change either once
      any user has linked an identity (409 `issuer_in_use`): a `sub` is unique only
      within its issuer, so every link would point at whoever has that `sub` at the
      new one. Add another provider instead. (At Entra, whose `sub` is pairwise per
      app registration, a `clientId` change breaks links the same way; core cannot
      detect that.) `issuer` cannot change while an unexpired identity invite names
      the provider (409 `provider_has_invites`): withdraw the invites first.
      Turning `countsAsMfa` on needs a caller holding `admin` through a global role
      (403 otherwise), and so does changing `issuer` or `clientId` while it stays
      on; turning it off does not. Changing `issuer` or `clientId` of a provider
      with an SSO-only domain needs global `admin` too (403 otherwise): its
      password users are force-linked to whoever the provider vouches for.
      Other errors are those of create.

      An audit log entry is created for this action.
      An `auth.identity-provider.updated` webhook event is emitted.
    operationId: updateAdminIdentityProvider
    security:
      - BearerAuth: [identity-providers.write]
    parameters:
      - $ref: '../../../components/auth/parameters.yaml#/IdentityProviderIdParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../../components/auth/schemas.yaml#/UpdateIdentityProviderRequest'
    responses:
      '200':
        description: The updated identity provider
        content:
          application/json:
            schema:
              $ref: '../../../components/auth/schemas.yaml#/IdentityProvider'
      '400':
        $ref: '../../../components/responses.yaml#/BadRequestResponse'
      '401':
        $ref: '../../../components/responses.yaml#/UnauthorizedResponse'
      '403':
        $ref: '../../../components/responses.yaml#/ForbiddenResponse'
      '404':
        $ref: '../../../components/responses.yaml#/NotFoundResponse'
      '409':
        $ref: '../../../components/responses.yaml#/ConflictResponse'
      '429':
        $ref: '../../../components/responses.yaml#/RateLimitResponse'
      '500':
        $ref: '../../../components/responses.yaml#/ServerErrorResponse'


/admin/identity-providers/{id}/deactivate:
  post:
    tags:
      - Admin - Identity Providers
    summary: Deactivate an identity provider
    description: |
      Takes the provider off the login page and refuses sign-ins that are under
      way. Identities already linked stay. Refused with 409 `sso_only_domain` while
      any of its domains is SSO-only, since those users would have no way in: turn
      `ssoOnly` off first.

      An audit log entry is created for this action.
      An `auth.identity-provider.deactivated` webhook event is emitted.
    operationId: deactivateAdminIdentityProvider
    security:
      - BearerAuth: [identity-providers.write]
    parameters:
      - $ref: '../../../components/auth/parameters.yaml#/IdentityProviderIdParam'
    responses:
      '200':
        description: The deactivated identity provider
        content:
          application/json:
            schema:
              $ref: '../../../components/auth/schemas.yaml#/IdentityProvider'
      '400':
        $ref: '../../../components/responses.yaml#/BadRequestResponse'
        description: Malformed id
      '401':
        $ref: '../../../components/responses.yaml#/UnauthorizedResponse'
      '403':
        $ref: '../../../components/responses.yaml#/ForbiddenResponse'
      '404':
        $ref: '../../../components/responses.yaml#/NotFoundResponse'
      '409':
        $ref: '../../../components/responses.yaml#/ConflictResponse'
      '429':
        $ref: '../../../components/responses.yaml#/RateLimitResponse'
      '500':
        $ref: '../../../components/responses.yaml#/ServerErrorResponse'


/admin/identity-providers/{id}/activate:
  post:
    tags:
      - Admin - Identity Providers
    summary: Activate an identity provider
    description: |
      Puts the provider back on the login page. The configuration is validated
      against the issuer again, since it may have changed while the provider was
      inactive (400 `invalid_provider_config` / `provider_unreachable`).

      An audit log entry is created for this action.
      An `auth.identity-provider.activated` webhook event is emitted.
    operationId: activateAdminIdentityProvider
    security:
      - BearerAuth: [identity-providers.write]
    parameters:
      - $ref: '../../../components/auth/parameters.yaml#/IdentityProviderIdParam'
    responses:
      '200':
        description: The activated identity provider
        content:
          application/json:
            schema:
              $ref: '../../../components/auth/schemas.yaml#/IdentityProvider'
      '400':
        $ref: '../../../components/responses.yaml#/BadRequestResponse'
      '401':
        $ref: '../../../components/responses.yaml#/UnauthorizedResponse'
      '403':
        $ref: '../../../components/responses.yaml#/ForbiddenResponse'
      '404':
        $ref: '../../../components/responses.yaml#/NotFoundResponse'
      '429':
        $ref: '../../../components/responses.yaml#/RateLimitResponse'
      '500':
        $ref: '../../../components/responses.yaml#/ServerErrorResponse'


/admin/identity-providers/{id}/domains:
  get:
    tags:
      - Admin - Identity Provider Domains
    summary: List a provider's domains
    description: |
      Returns the email domains claimed by the provider, ordered by domain, with their organization and default roles.
    operationId: listAdminIdentityProviderDomains
    security:
      - BearerAuth: [identity-providers.read]
    parameters:
      - $ref: '../../../components/auth/parameters.yaml#/IdentityProviderIdParam'
    responses:
      '200':
        description: The domains
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../../../components/auth/schemas.yaml#/IdentityProviderDomain'
      '400':
        $ref: '../../../components/responses.yaml#/BadRequestResponse'
        description: Malformed id
      '401':
        $ref: '../../../components/responses.yaml#/UnauthorizedResponse'
      '403':
        $ref: '../../../components/responses.yaml#/ForbiddenResponse'
      '404':
        $ref: '../../../components/responses.yaml#/NotFoundResponse'
      '429':
        $ref: '../../../components/responses.yaml#/RateLimitResponse'
      '500':
        $ref: '../../../components/responses.yaml#/ServerErrorResponse'

  post:
    tags:
      - Admin - Identity Provider Domains
    summary: Add a domain to a provider
    description: |
      Claims an email domain for the provider. A domain belongs to one provider,
      globally (409 `domain_taken`). `autoAccept` creates a user on the first
      verified sign-in at this domain, in `organizationId` as `member` with
      `roleIds`; `ssoOnly` refuses password sign-in for the domain's users. The two
      are independent. `domain` is lowercased and a leading `@` dropped.
      `ssoOnly: true` is refused with 409 `provider_inactive` while the provider
      is deactivated, since the domain's users would have no way to sign in, and
      with 403 unless the caller holds `admin` through a global role: a password
      sign-in at an SSO-only domain is force-linked to the provider. Creating
      a domain SSO-only ends, right after, every session of its users who
      hold an identity at another provider (audited and emitted as
      `auth.user.sessions-revoked`).

      `roleIds` must be roles that may be assigned within an organization: 400
      `unknown_role` for an unknown, archived or retired role, 400
      `not_org_assignable` for a role with permissions that cannot be granted in
      an organization, 403 for a system role or a role granting a permission the
      caller lacks (as when assigning roles to a user). 404 when the organization
      does not exist or is archived.

      An audit log entry is created for this action. An
      `auth.identity-provider.domain-created` webhook event is emitted.
    operationId: createAdminIdentityProviderDomain
    security:
      - BearerAuth: [identity-providers.write]
    parameters:
      - $ref: '../../../components/auth/parameters.yaml#/IdentityProviderIdParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../../components/auth/schemas.yaml#/CreateIdentityProviderDomainRequest'
    responses:
      '201':
        description: Domain added
        content:
          application/json:
            schema:
              $ref: '../../../components/auth/schemas.yaml#/IdentityProviderDomain'
      '400':
        $ref: '../../../components/responses.yaml#/BadRequestResponse'
      '401':
        $ref: '../../../components/responses.yaml#/UnauthorizedResponse'
      '403':
        $ref: '../../../components/responses.yaml#/ForbiddenResponse'
      '404':
        $ref: '../../../components/responses.yaml#/NotFoundResponse'
      '409':
        $ref: '../../../components/responses.yaml#/ConflictResponse'
      '429':
        $ref: '../../../components/responses.yaml#/RateLimitResponse'
      '500':
        $ref: '../../../components/responses.yaml#/ServerErrorResponse'


/admin/identity-providers/{id}/domains/{domainId}:
  get:
    tags:
      - Admin - Identity Provider Domains
    summary: Get a domain
    description: |
      Returns one domain of the provider.
    operationId: getAdminIdentityProviderDomain
    security:
      - BearerAuth: [identity-providers.read]
    parameters:
      - $ref: '../../../components/auth/parameters.yaml#/IdentityProviderIdParam'
      - $ref: '../../../components/auth/parameters.yaml#/IdentityProviderDomainIdParam'
    responses:
      '200':
        description: The domain
        content:
          application/json:
            schema:
              $ref: '../../../components/auth/schemas.yaml#/IdentityProviderDomain'
      '400':
        $ref: '../../../components/responses.yaml#/BadRequestResponse'
        description: Malformed id
      '401':
        $ref: '../../../components/responses.yaml#/UnauthorizedResponse'
      '403':
        $ref: '../../../components/responses.yaml#/ForbiddenResponse'
      '404':
        $ref: '../../../components/responses.yaml#/NotFoundResponse'
      '429':
        $ref: '../../../components/responses.yaml#/RateLimitResponse'
      '500':
        $ref: '../../../components/responses.yaml#/ServerErrorResponse'

  patch:
    tags:
      - Admin - Identity Provider Domains
    summary: Update a domain
    description: |
      Changes only the fields sent. `roleIds` replaces the whole set of default
      roles; roles the domain already hands out are kept without the grant check, so
      a narrower admin can still edit a domain a broader one set up. Moving the domain
      to another `organizationId` grants its roles (those sent, or else its current
      ones) in that organization, so all of them are checked there. Errors are those
      of adding a domain, including 409 `provider_inactive` for `ssoOnly: true` on a
      deactivated provider. Turning `ssoOnly` on or off, or changing the `domain` of
      an SSO-only domain, needs `admin` through a global role (403 otherwise).
      A change that makes the domain SSO-only (or renames an SSO-only one)
      ends the sessions of its users who hold an identity at another
      provider, as on create.

      An audit log entry is created for this action. An
      `auth.identity-provider.domain-updated` webhook event is emitted.
    operationId: updateAdminIdentityProviderDomain
    security:
      - BearerAuth: [identity-providers.write]
    parameters:
      - $ref: '../../../components/auth/parameters.yaml#/IdentityProviderIdParam'
      - $ref: '../../../components/auth/parameters.yaml#/IdentityProviderDomainIdParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../../components/auth/schemas.yaml#/UpdateIdentityProviderDomainRequest'
    responses:
      '200':
        description: The updated domain
        content:
          application/json:
            schema:
              $ref: '../../../components/auth/schemas.yaml#/IdentityProviderDomain'
      '400':
        $ref: '../../../components/responses.yaml#/BadRequestResponse'
      '401':
        $ref: '../../../components/responses.yaml#/UnauthorizedResponse'
      '403':
        $ref: '../../../components/responses.yaml#/ForbiddenResponse'
      '404':
        $ref: '../../../components/responses.yaml#/NotFoundResponse'
      '409':
        $ref: '../../../components/responses.yaml#/ConflictResponse'
      '429':
        $ref: '../../../components/responses.yaml#/RateLimitResponse'
      '500':
        $ref: '../../../components/responses.yaml#/ServerErrorResponse'

  delete:
    tags:
      - Admin - Identity Provider Domains
    summary: Remove a domain
    description: |
      Releases the domain and its default roles. Users already created through it
      keep their accounts and identities. Deleting an SSO-only domain reopens its
      users to passwords, so it needs `admin` through a global role (403
      otherwise). An audit log entry is created for this action. An
      `auth.identity-provider.domain-deleted` webhook event is emitted.
    operationId: deleteAdminIdentityProviderDomain

    security:
      - BearerAuth: [identity-providers.write]
    parameters:
      - $ref: '../../../components/auth/parameters.yaml#/IdentityProviderIdParam'
      - $ref: '../../../components/auth/parameters.yaml#/IdentityProviderDomainIdParam'
    responses:
      '204':
        $ref: '../../../components/responses.yaml#/NoContentResponse'
      '400':
        $ref: '../../../components/responses.yaml#/BadRequestResponse'
        description: Malformed id
      '401':
        $ref: '../../../components/responses.yaml#/UnauthorizedResponse'
      '403':
        $ref: '../../../components/responses.yaml#/ForbiddenResponse'
      '404':
        $ref: '../../../components/responses.yaml#/NotFoundResponse'
      '429':
        $ref: '../../../components/responses.yaml#/RateLimitResponse'
      '500':
        $ref: '../../../components/responses.yaml#/ServerErrorResponse'


auth.identity-provider.created:
  post:
    tags:
      - Admin - Identity Providers
    summary: Identity provider created
    description: Fired when an identity provider is created.
    operationId: webhookIdentityProviderCreated
    security: []
    parameters:
      - $ref: '../../../components/parameters.yaml#/WebhookIdHeader'
      - $ref: '../../../components/parameters.yaml#/WebhookEventHeader'
      - $ref: '../../../components/parameters.yaml#/WebhookTimestampHeader'
      - $ref: '../../../components/parameters.yaml#/WebhookSignatureHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../../components/webhook-schemas.yaml#/OrganizationWebhookEvent'
              - type: object
                properties:
                  eventType:
                    const: auth.identity-provider.created
                  entityType:
                    const: IdentityProvider
                  data:
                    type: object
                    required: [id, slug, displayName, kind]
                    properties:
                      id: { type: string, format: uuid }
                      slug: { type: string }
                      displayName: { type: string }
                      kind: { type: string, enum: [oidc] }
    responses:
      '2XX':
        description: Any 2xx response acknowledges the delivery; anything else is retried.

