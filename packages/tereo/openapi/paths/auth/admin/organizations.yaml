auth.organization.created:
  post:
    tags:
      - Admin - Organizations
    summary: Organization created
    description: Fired when an organization is created. `data` is the organization.
    operationId: webhookOrganizationCreated
    security: []
    parameters:
      - $ref: '../../../components/parameters.yaml#/WebhookIdHeader'
      - $ref: '../../../components/parameters.yaml#/WebhookEventHeader'
      - $ref: '../../../components/parameters.yaml#/WebhookTimestampHeader'
      - $ref: '../../../components/parameters.yaml#/WebhookSignatureHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../../components/webhook-schemas.yaml#/OrganizationWebhookEvent'
              - type: object
                properties:
                  eventType:
                    const: auth.organization.created
                  entityType:
                    const: Organization
                  data:
                    $ref: '../../../components/auth/schemas.yaml#/Organization'
    responses:
      '2XX':
        description: Any 2xx response acknowledges the delivery; anything else is retried.

auth.organization.updated:
