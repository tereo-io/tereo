            $ref: '../../../components/headers.yaml#/X-RateLimit-Reset'
        content:
          application/json:
            schema:
              $ref: '../../../components/auth/schemas.yaml#/AdminUserTotpStatusResponse'
      '400':
        $ref: '../../../components/responses.yaml#/BadRequestResponse'
        description: Invalid user id
      '401':
        $ref: '../../../components/responses.yaml#/UnauthorizedResponse'
      '403':
        $ref: '../../../components/responses.yaml#/ForbiddenResponse'
        description: Forbidden - missing users.read permission
      '404':
        $ref: '../../../components/responses.yaml#/NotFoundResponse'
      '429':
        $ref: '../../../components/responses.yaml#/RateLimitResponse'
      '500':
        $ref: '../../../components/responses.yaml#/ServerErrorResponse'
/admin/users/{id}/totp/reset:
  post:
    tags:
      - Admin - User TOTP
    summary: Reset user TOTP
    description: |
      Resets a user's two-factor authentication: TOTP is disabled and the
      user's recovery codes are deleted, so they must enrol again (at their
      next login, when TOTP is required). No codes are returned — an admin
      never sees a user's recovery codes. All of the user's sessions and
      token families end in the same transaction.

      Only a caller holding every permission the user holds (from global
      roles or roles in any organization) may reset it (`403`, naming the
      permissions the caller lacks, otherwise); the caller's permissions count
      from global roles only, capped by a delegated token's scopes. The
      system user (`400 system_user`) and a service's service-account user
      (`403`) are refused, as on `PATCH /v1/admin/users/{id}`.

      An audit log entry is created (the admin as actor, `metadata.action`
      `totp_reset`), and an `auth.user.totp-reset` webhook event is emitted.
      When sessions were ended, a second entry (`metadata.action`
      `sessions_revoked`) and an `auth.user.sessions-revoked` event record
      them.
    operationId: postAdminUserTotpReset
    security:
      - BearerAuth: [users.write]
    parameters:
      - $ref: '../../../components/auth/parameters.yaml#/UserIdParam'
    responses:
      '200':
        description: TOTP reset
        headers:
          X-RateLimit-Limit:
            $ref: '../../../components/headers.yaml#/X-RateLimit-Limit'
          X-RateLimit-Remaining:
            $ref: '../../../components/headers.yaml#/X-RateLimit-Remaining'
          X-RateLimit-Reset:
            $ref: '../../../components/headers.yaml#/X-RateLimit-Reset'
        content:
          application/json:
            schema:
              type: object
              required:
                - success
                - message
              properties:
                success:
                  type: boolean
                message:
                  type: string
      '400':
        $ref: '../../../components/responses.yaml#/BadRequestResponse'
        description: TOTP is not enabled for this user (`totp_not_enabled`), the target is the system user (`system_user`), or invalid user id
      '401':
        $ref: '../../../components/responses.yaml#/UnauthorizedResponse'
      '403':
        $ref: '../../../components/responses.yaml#/ForbiddenResponse'
        description: Forbidden - missing users.write permission, the user is a service's service account, or the user holds a permission the caller does not
      '404':
        $ref: '../../../components/responses.yaml#/NotFoundResponse'
      '429':
        $ref: '../../../components/responses.yaml#/RateLimitResponse'
      '500':
        $ref: '../../../components/responses.yaml#/ServerErrorResponse'

# ============================================
# WEBHOOK EVENTS
# ============================================

auth.user.totp-reset:
  post:
    tags:
      - Admin - User TOTP
    summary: User TOTP reset
    description: Fired when an admin resets a user's TOTP with `POST /v1/admin/users/{id}/totp/reset` — TOTP disabled and recovery codes deleted.
    operationId: webhookUserTotpReset
    security: []
    parameters:
      - $ref: '../../../components/parameters.yaml#/WebhookIdHeader'
      - $ref: '../../../components/parameters.yaml#/WebhookEventHeader'
      - $ref: '../../../components/parameters.yaml#/WebhookTimestampHeader'
      - $ref: '../../../components/parameters.yaml#/WebhookSignatureHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../../components/webhook-schemas.yaml#/OrganizationWebhookEvent'
              - type: object
                properties:
                  eventType:
                    const: auth.user.totp-reset
                  entityType:
                    const: User
                  data:
                    type: object
                    required: [userId, email]
                    properties:
                      userId:
                        type: string
                        format: uuid
                      email:
                        type: string
    responses:
      '2XX':
        description: Any 2xx response acknowledges the delivery; anything else is retried.

auth.user.updated:
  post:
    tags:
      - Admin - Users
    summary: User updated
    description: Fired when an admin updates a user. `data` is the user after the change.
    operationId: webhookUserUpdated
    security: []
    parameters:
      - $ref: '../../../components/parameters.yaml#/WebhookIdHeader'
      - $ref: '../../../components/parameters.yaml#/WebhookEventHeader'
      - $ref: '../../../components/parameters.yaml#/WebhookTimestampHeader'
      - $ref: '../../../components/parameters.yaml#/WebhookSignatureHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../../components/webhook-schemas.yaml#/OrganizationWebhookEvent'
              - type: object
                properties:
                  eventType:
                    const: auth.user.updated
                  entityType:
                    const: User
                  data:
                    $ref: '../../../components/auth/schemas.yaml#/User'
    responses:
      '2XX':
        description: Any 2xx response acknowledges the delivery; anything else is retried.

auth.user.roles-changed:
  post:
    tags:
      - Admin - Users
    summary: User roles changed
    description: Fired when a user's global role assignments are replaced.
    operationId: webhookUserRolesChanged
    security: []
    parameters:
      - $ref: '../../../components/parameters.yaml#/WebhookIdHeader'
      - $ref: '../../../components/parameters.yaml#/WebhookEventHeader'
      - $ref: '../../../components/parameters.yaml#/WebhookTimestampHeader'
      - $ref: '../../../components/parameters.yaml#/WebhookSignatureHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../../components/webhook-schemas.yaml#/OrganizationWebhookEvent'
              - type: object
                properties:
                  eventType:
                    const: auth.user.roles-changed
                  entityType:
                    const: User
                  data:
                    type: object
                    required: [userId, email, roleIds]
                    properties:
                      userId:
                        type: string
                        format: uuid
                      email:
                        type: string
                      roleIds:
                        type: array
                        items:
                          type: string
                          format: uuid
                        description: The user's role ids after the change
    responses:
      '2XX':
        description: Any 2xx response acknowledges the delivery; anything else is retried.

auth.user.created:
  post:
    tags:
      - Admin - Users
    summary: User created
    description: Fired when a user is created with `POST /v1/admin/users`.
    operationId: webhookUserCreated
    security: []
    parameters:
      - $ref: '../../../components/parameters.yaml#/WebhookIdHeader'
      - $ref: '../../../components/parameters.yaml#/WebhookEventHeader'
      - $ref: '../../../components/parameters.yaml#/WebhookTimestampHeader'
      - $ref: '../../../components/parameters.yaml#/WebhookSignatureHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../../components/webhook-schemas.yaml#/OrganizationWebhookEvent'
              - type: object
                properties:
                  eventType:
                    const: auth.user.created
                  entityType:
                    const: User
                  data:
                    type: object
                    required: [id, email, name, isActive, userType, hasPassword, createdAt, updatedAt]
                    properties:
