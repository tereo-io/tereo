/password-reset:
  post:
    tags:
      - Password Reset
    summary: Request a password reset email
    description: |
      Asks for a reset link to be emailed to an address. Public. The answer is
      always `202` with an empty body, sent before any work is done (the reset
      is processed after the response), so neither the status, the timing nor
      an error reveals whether the address has an account. A link is sent only
      when an account exists for the address, is active and unexpired, is a
      human or guest (not a service account or the system user), is not on an
      SSO-only domain, and a default email connection exists. The link goes to
      `/set-password#token=...`, works once, replaces any earlier setup or
      reset link and expires after `PASSWORD_RESET_TTL_SECONDS` (1 hour by
      default); the email is a sensitive notification. A `client_id` that
      names a login client is carried in the link so the page shows that
      client's branding; any other value is ignored.

      Requests are limited per hour: 10 per IP (for any addresses), 3 per
      address from one IP, and 10 per address from all IPs together. Each is
      counted for every request whether or not the address has an account, and
      a request over any of them is still `202` but sends nothing. One source
      can therefore spend at most 3 of an address's 10; using up a victim's
      allowance and delaying their genuine reset for the hour takes requests
      from at least four IPs.

      Redeeming the link (`POST /v1/password-setup`) sets the password, marks
      the address verified, clears pending forced-password-change grants and
      ends the user's other sessions. An audit entry is written and
      `auth.user.password-reset-requested` is emitted when a link is issued.
    operationId: requestPasswordReset
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/auth/schemas.yaml#/PasswordResetRequest'
    responses:
      '202':
        description: Accepted, whether or not a link was sent
        headers:
          X-RateLimit-Limit:
            $ref: '../../components/headers.yaml#/X-RateLimit-Limit'
          X-RateLimit-Remaining:
            $ref: '../../components/headers.yaml#/X-RateLimit-Remaining'
          X-RateLimit-Reset:
            $ref: '../../components/headers.yaml#/X-RateLimit-Reset'
      '400':
        $ref: '../../components/responses.yaml#/BadRequestResponse'
      '403':
        $ref: '../../components/responses.yaml#/ForbiddenResponse'
        description: A browser request whose `Origin` is not core's own, the admin UI's or one listed in `CORS_ALLOWED_ORIGINS`. Refused before any limit is counted; a request with no `Origin` header is not checked
      '429':
        $ref: '../../components/responses.yaml#/RateLimitResponse'
      '503':
        $ref: '../../components/responses.yaml#/ServiceUnavailableResponse'
      '500':
        $ref: '../../components/responses.yaml#/ServerErrorResponse'

/password-reset/status:
  get:
    tags:
      - Password Reset
    summary: Whether password reset is available
    description: |
      Public. `enabled` is true when a default email connection exists, so the
      sign-in page knows whether to offer "Forgot password".
    operationId: getPasswordResetStatus
    security: []
    responses:
      '200':
        description: Availability
        headers:
          X-RateLimit-Limit:
            $ref: '../../components/headers.yaml#/X-RateLimit-Limit'
          X-RateLimit-Remaining:
            $ref: '../../components/headers.yaml#/X-RateLimit-Remaining'
          X-RateLimit-Reset:
            $ref: '../../components/headers.yaml#/X-RateLimit-Reset'
        content:
          application/json:
            schema:
              $ref: '../../components/auth/schemas.yaml#/PasswordResetStatusResponse'
      '429':
        $ref: '../../components/responses.yaml#/RateLimitResponse'
      '500':
        $ref: '../../components/responses.yaml#/ServerErrorResponse'

auth.user.password-reset-requested:
  post:
    tags:
      - Password Reset
    summary: Password reset requested
    description: Fired when a password reset link is issued for a user. The link itself is never in the event.
    operationId: webhookUserPasswordResetRequested
    security: []
    parameters:
      - $ref: '../../components/parameters.yaml#/WebhookIdHeader'
      - $ref: '../../components/parameters.yaml#/WebhookEventHeader'
      - $ref: '../../components/parameters.yaml#/WebhookTimestampHeader'
      - $ref: '../../components/parameters.yaml#/WebhookSignatureHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/webhook-schemas.yaml#/OrganizationWebhookEvent'
              - type: object
                properties:
                  eventType:
                    const: auth.user.password-reset-requested
                  entityType:
                    const: User
                  data:
                    type: object
                    required: [userId, email]
                    properties:
                      userId:
                        type: string
                        format: uuid
                      email:
                        type: string
                      expiresAt:
                        type: string
                        format: date-time
    responses:
      '2XX':
        description: Any 2xx response acknowledges the delivery; anything else is retried.
