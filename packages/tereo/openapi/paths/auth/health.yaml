/health:
  get:
    tags:
      - Health
    summary: Health check
    description: |
      Probes Postgres and Redis (500 ms timeout each; Postgres on a
      connection outside the request pool). Returns `200` with `status: ok`
      when both answer, `503` with `status: degraded` and the failing
      dependency marked `fail` otherwise. For monitoring and startup probes;
      readiness probes use `/health/ready`. Public, so it names no version.
      The probe result is shared for one second, and requests are limited per
      client IP (300 a second, 1000 for a direct connection from an internal
      network address).
    operationId: getHealth
    security: []
    responses:
      '200':
        description: Postgres and Redis are reachable
        content:
          application/json:
            schema:
              $ref: '../../components/auth/schemas.yaml#/HealthStatus'
      '429':
        $ref: '../../components/responses.yaml#/RateLimitResponse'
      '503':
        description: Postgres or Redis is unreachable
        content:
          application/json:
            schema:
              $ref: '../../components/auth/schemas.yaml#/HealthStatus'
/health/ready:
  get:
    tags:
      - Health
    summary: Readiness check
    description: |
      For readiness probes and load balancer health checks. Returns `200`
      with `status: ok` while core serves, and `503` with `status: draining`
      once shutdown has started. It does not probe Postgres or Redis, so a
      dependency that slows under load does not take every replica out of
      rotation at once; `/health` reports them. Rate-limited as `/health`.
    operationId: getReady
    security: []
    responses:
      '200':
        description: Core is serving
        content:
          application/json:
            schema:
              $ref: '../../components/auth/schemas.yaml#/ReadinessStatus'
      '429':
        $ref: '../../components/responses.yaml#/RateLimitResponse'
      '503':
        description: Core is shutting down
        content:
          application/json:
            schema:
              $ref: '../../components/auth/schemas.yaml#/ReadinessStatus'
