/password-setup/inspect:
  post:
    tags:
      - Password Setup
    summary: Inspect a password setup or reset link
    description: |
      Who a setup or reset link is for and when it expires, so the page can greet
      them. Public: the token from the link's URL fragment is the credential.
      Consumes nothing. Every
      miss, whether the token is unknown, used or expired, or its user is no
      longer reachable by the link (deactivated or expired; for a setup link, no longer a guest;
      for either, an email address now on an SSO-only domain), is the same `404`, and counts against the caller's IP
      (`429` past the limit, `503` when the limiter cannot reach Redis).
    operationId: inspectPasswordSetup
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/auth/schemas.yaml#/PasswordSetupInspectRequest'
    responses:
      '200':
        description: The link's user and expiry
        headers:
          X-RateLimit-Limit:
            $ref: '../../components/headers.yaml#/X-RateLimit-Limit'
          X-RateLimit-Remaining:
            $ref: '../../components/headers.yaml#/X-RateLimit-Remaining'
          X-RateLimit-Reset:
            $ref: '../../components/headers.yaml#/X-RateLimit-Reset'
        content:
          application/json:
            schema:
              $ref: '../../components/auth/schemas.yaml#/PasswordSetupInspectResponse'
      '400':
        $ref: '../../components/responses.yaml#/BadRequestResponse'
      '404':
        $ref: '../../components/responses.yaml#/NotFoundResponse'
        description: Unknown, used or expired token, or a user the link no longer reaches
      '429':
        $ref: '../../components/responses.yaml#/RateLimitResponse'
      '503':
        $ref: '../../components/responses.yaml#/ServiceUnavailableResponse'
      '500':
        $ref: '../../components/responses.yaml#/ServerErrorResponse'

/password-setup:
  post:
    tags:
      - Password Setup
    summary: Set a password from a setup or reset link
    description: |
      Sets the user's password, consumes the token, clears
      `passwordChangeRequired` and any pending forced-password-change grants,
      and ends the user's other sessions, in one transaction. A reset link
      also marks the address verified, since only the inbox received it; a
      setup link does not, as its URL is returned to the inviter. The token works once: of two concurrent requests with it,
      one succeeds. Public, with the same uniform `404` and per-IP limit as
      `POST /v1/password-setup/inspect`. The password follows the password
      rules (`400 invalid_request`).

      The same route redeems a reset link (`POST /v1/password-reset`), which
      also reaches human users, not only guests. Both link kinds are refused
      (the uniform `404`) once the user's email domain is SSO-only. An audit
      log entry is created and `auth.user.password-set` is emitted, with
      `via` set to `setup` or `reset` (never carrying the password). The UI then offers a sign-in at `/`.
    operationId: setPasswordFromLink
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/auth/schemas.yaml#/PasswordSetupRequest'
    responses:
      '204':
        description: Password set
        headers:
          X-RateLimit-Limit:
            $ref: '../../components/headers.yaml#/X-RateLimit-Limit'
          X-RateLimit-Remaining:
            $ref: '../../components/headers.yaml#/X-RateLimit-Remaining'
          X-RateLimit-Reset:
            $ref: '../../components/headers.yaml#/X-RateLimit-Reset'
      '400':
        $ref: '../../components/responses.yaml#/BadRequestResponse'
      '404':
        $ref: '../../components/responses.yaml#/NotFoundResponse'
        description: Unknown, used or expired token, or a user the link no longer reaches
      '429':
        $ref: '../../components/responses.yaml#/RateLimitResponse'
      '503':
        $ref: '../../components/responses.yaml#/ServiceUnavailableResponse'
      '500':
        $ref: '../../components/responses.yaml#/ServerErrorResponse'

auth.user.password-setup-link-issued:
  post:
    tags:
      - Password Setup
    summary: Password setup link issued
    description: Fired when a password setup link is issued for a user. The link itself is never in the event.
    operationId: webhookUserPasswordSetupLinkIssued
    security: []
    parameters:
      - $ref: '../../components/parameters.yaml#/WebhookIdHeader'
      - $ref: '../../components/parameters.yaml#/WebhookEventHeader'
      - $ref: '../../components/parameters.yaml#/WebhookTimestampHeader'
      - $ref: '../../components/parameters.yaml#/WebhookSignatureHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/webhook-schemas.yaml#/OrganizationWebhookEvent'
              - type: object
                properties:
                  eventType:
                    const: auth.user.password-setup-link-issued
                  entityType:
                    const: User
                  data:
                    type: object
                    required: [userId, email]
                    properties:
                      userId:
                        type: string
                        format: uuid
                      email:
                        type: string
                      expiresAt:
                        type: string
                        format: date-time
                      notified:
                        type: boolean

    responses:
      '2XX':
        description: Any 2xx response acknowledges the delivery; anything else is retried.

auth.user.password-set:
  post:
    tags:
      - Password Setup
    summary: Password set from a link
    description: Fired when a user sets their password from a setup or reset link. Never carries the password.
    operationId: webhookUserPasswordSet
    security: []
    parameters:
      - $ref: '../../components/parameters.yaml#/WebhookIdHeader'
      - $ref: '../../components/parameters.yaml#/WebhookEventHeader'
      - $ref: '../../components/parameters.yaml#/WebhookTimestampHeader'
      - $ref: '../../components/parameters.yaml#/WebhookSignatureHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/webhook-schemas.yaml#/OrganizationWebhookEvent'
              - type: object
                properties:
                  eventType:
                    const: auth.user.password-set
                  entityType:
                    const: User
                  data:
                    type: object
                    required: [userId, email]
                    properties:
                      userId:
                        type: string
                        format: uuid
                      email:
                        type: string
                      via:
                        type: string
                        enum: [setup, reset]

    responses:
      '2XX':
        description: Any 2xx response acknowledges the delivery; anything else is retried.
