/account/me:
  get:
    tags:
      - Account - Profile
    summary: Get current user profile
    description: Returns the authenticated user's profile information
    operationId: getAccountMe
    security:
      - BearerAuth: []
    responses:
      '200':
        description: User profile
        headers:
          X-RateLimit-Limit:
            $ref: '../../components/headers.yaml#/X-RateLimit-Limit'
          X-RateLimit-Remaining:
            $ref: '../../components/headers.yaml#/X-RateLimit-Remaining'
          X-RateLimit-Reset:
            $ref: '../../components/headers.yaml#/X-RateLimit-Reset'
        content:
          application/json:
            schema:
              $ref: '../../components/auth/schemas.yaml#/UserProfile'
      '401':
        $ref: '../../components/responses.yaml#/UnauthorizedResponse'
      '403':
        $ref: '../../components/auth/responses.yaml#/AccountForbiddenResponse'
      '429':
        $ref: '../../components/responses.yaml#/RateLimitResponse'
      '500':
        $ref: '../../components/responses.yaml#/ServerErrorResponse'
/account/sessions:
  get:
    tags:
      - Account - Sessions
    summary: List active sessions
    description: Returns all active sessions for the authenticated user
    operationId: getAccountSessions
    security:
      - BearerAuth: []
    responses:
      '200':
        description: List of active sessions
        headers:
          X-RateLimit-Limit:
            $ref: '../../components/headers.yaml#/X-RateLimit-Limit'
          X-RateLimit-Remaining:
            $ref: '../../components/headers.yaml#/X-RateLimit-Remaining'
          X-RateLimit-Reset:
            $ref: '../../components/headers.yaml#/X-RateLimit-Reset'
        content:
          application/json:
            schema:
              $ref: '../../components/auth/schemas.yaml#/SessionsResponse'
      '401':
        $ref: '../../components/responses.yaml#/UnauthorizedResponse'
      '403':
        $ref: '../../components/auth/responses.yaml#/AccountForbiddenResponse'
      '429':
        $ref: '../../components/responses.yaml#/RateLimitResponse'
      '500':
        $ref: '../../components/responses.yaml#/ServerErrorResponse'
  delete:
    tags:
      - Account - Sessions
    summary: Revoke all sessions
    description: |
      Revokes every active session (refresh token, and the access tokens
      issued from it) of the authenticated user except the one the request's
      token belongs to — that one too when `includeCurrentSession` is `true`.
      This is "sign out everywhere": the user's SSO sessions end in every
      browser, so silent login (`prompt=none`) and org switching stop working
      until the user signs in again — except the SSO session in the caller's
      own browser, which is kept unless `includeCurrentSession` is `true`.
      (`/oauth/end-session` signs out only the calling browser.) The body is
      optional.

      When any session was revoked or SSO session ended, a `LOGOUT` audit
      entry is created
      (`metadata.action: "sessions_revoked"`, `method: "account"`,
      `sessionIds` and `ssoSessionIds` the refresh tokens revoked and SSO
      sessions ended) and an `auth.user.sessions-revoked` webhook event is
      emitted.
    operationId: deleteAccountSessions
    security:
      - BearerAuth: []
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              includeCurrentSession:
                type: boolean
                default: false
    responses:
      '200':
        description: Sessions revoked
        headers:
          X-RateLimit-Limit:
            $ref: '../../components/headers.yaml#/X-RateLimit-Limit'
          X-RateLimit-Remaining:
            $ref: '../../components/headers.yaml#/X-RateLimit-Remaining'
          X-RateLimit-Reset:
            $ref: '../../components/headers.yaml#/X-RateLimit-Reset'
        content:
          application/json:
            schema:
              type: object
              required:
                - revokedCount
                - currentSessionRevoked
              properties:
                revokedCount:
                  type: integer
                currentSessionRevoked:
                  type: boolean
                  description: "Whether the session the request's token belongs to was among those revoked (only with `includeCurrentSession: true`)."
      '400':
        $ref: '../../components/responses.yaml#/BadRequestResponse'
        description: Invalid body (`invalid_request`)
      '401':
        $ref: '../../components/responses.yaml#/UnauthorizedResponse'
      '403':
        $ref: '../../components/auth/responses.yaml#/AccountForbiddenResponse'
      '429':
        $ref: '../../components/responses.yaml#/RateLimitResponse'
      '500':
        $ref: '../../components/responses.yaml#/ServerErrorResponse'
/account/sessions/{sessionId}:
  delete:
    tags:
      - Account - Sessions
    summary: Revoke specific session
    description: |
      Signs out the browser one of the authenticated user's active sessions
      belongs to: revokes the session (its refresh token and the access
      tokens issued from it), ends the SSO session it was issued under, and
      revokes every other token family obtained through that SSO session
      (silent logins and org switches included). That browser cannot get new
      tokens with `prompt=none` or an org switch; the user's other browsers
      are untouched. Revoking the caller's own session signs out the
      caller's browser. `404` when no active session of the user has this
      id — including another user's session.

      A `LOGOUT` audit entry is created (`metadata.action:
      "sessions_revoked"`, `method: "account"`, `sessionIds` this session
      then every sibling family revoked with its browser, `ssoSessionIds`
      the SSO session ended).
      An `auth.user.sessions-revoked` webhook event is emitted, listing the
      same.
    operationId: deleteAccountSession
    security:
      - BearerAuth: []
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: Session revoked successfully
        headers:
          X-RateLimit-Limit:
            $ref: '../../components/headers.yaml#/X-RateLimit-Limit'
          X-RateLimit-Remaining:
            $ref: '../../components/headers.yaml#/X-RateLimit-Remaining'
          X-RateLimit-Reset:
            $ref: '../../components/headers.yaml#/X-RateLimit-Reset'
      '400':
        $ref: '../../components/responses.yaml#/BadRequestResponse'
        description: '`sessionId` is not a UUID (`invalid_request`)'
      '401':
        $ref: '../../components/responses.yaml#/UnauthorizedResponse'
      '403':
        $ref: '../../components/auth/responses.yaml#/AccountForbiddenResponse'
      '404':
        $ref: '../../components/responses.yaml#/NotFoundResponse'
        description: No active session of the user has this id
      '429':
        $ref: '../../components/responses.yaml#/RateLimitResponse'
      '500':
        $ref: '../../components/responses.yaml#/ServerErrorResponse'
/account/service:
  get:
    tags:
      - Account - Profile
    summary: Get the calling service
    description: |
      Returns the app service whose client is calling: the declaration version and hash core
      last applied, when, and its access — so a service can check at start that its
      provisioning document has been applied. No permission is needed.

      Any other caller — a person, an integration — gets `404`.
    operationId: getAccountService
    security:
      - BearerAuth: []
    responses:
      '200':
        description: The calling service
        headers:
          X-RateLimit-Limit:
            $ref: '../../components/headers.yaml#/X-RateLimit-Limit'
          X-RateLimit-Remaining:
            $ref: '../../components/headers.yaml#/X-RateLimit-Remaining'
          X-RateLimit-Reset:
            $ref: '../../components/headers.yaml#/X-RateLimit-Reset'
        content:
          application/json:
            schema:
              $ref: '../../components/auth/schemas.yaml#/AccountService'
      '401':
        $ref: '../../components/responses.yaml#/UnauthorizedResponse'
      '403':
        $ref: '../../components/auth/responses.yaml#/AccountForbiddenResponse'
      '404':
        $ref: '../../components/responses.yaml#/NotFoundResponse'
      '429':
        $ref: '../../components/responses.yaml#/RateLimitResponse'
      '500':
        $ref: '../../components/responses.yaml#/ServerErrorResponse'
/account/password:
  post:
    tags:
      - Account - Profile
    summary: Change password
    description: |
      Changes the authenticated user's password after checking the current
      one. Every other active session of the user is revoked, and the user's
      SSO sessions end in every other browser, so silent login
      (`prompt=none`) and org switching stop working there until the user
      signs in again. The session the request's token belongs to, and the SSO
      session in its browser, are kept.

      Attempts are limited to 5 per user per 300 seconds, counted before the
      current password is checked and cleared by a correct one; past that,
      `429 too_many_requests`.

      A user without a password (`hasPassword: false`, one who signs in through
      an identity provider) cannot set one here: 400 `no_password`, before any
      attempt is counted. An admin sets one with `PATCH /v1/admin/users/{id}`.

      The password changes in the transaction that ends the other sessions.
      An audit log entry is created for this action, and an
      `auth.user.password-changed` webhook event is emitted; when any session
      ended, so are a `sessions_revoked` entry and an
      `auth.user.sessions-revoked` event.
    operationId: postAccountPassword
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/auth/schemas.yaml#/ChangePasswordRequest'
    responses:
      '200':
        description: Password changed successfully
        headers:
          X-RateLimit-Limit:
            $ref: '../../components/headers.yaml#/X-RateLimit-Limit'
          X-RateLimit-Remaining:
            $ref: '../../components/headers.yaml#/X-RateLimit-Remaining'
          X-RateLimit-Reset:
            $ref: '../../components/headers.yaml#/X-RateLimit-Reset'
        content:
          application/json:
            schema:
              type: object
              required:
                - success
                - message
              properties:
                success:
                  type: boolean
                  const: true
                message:
                  type: string
      '400':
        description: |
          Invalid body, including a new password that fails the password
          policy (`invalid_request`); the user has no password to change
          (`no_password`); the current password is wrong
          (`invalid_password`); or the new password equals the current one
          (`same_password`).
        headers:
          X-RateLimit-Limit:
            $ref: '../../components/headers.yaml#/X-RateLimit-Limit'
          X-RateLimit-Remaining:
            $ref: '../../components/headers.yaml#/X-RateLimit-Remaining'
          X-RateLimit-Reset:
            $ref: '../../components/headers.yaml#/X-RateLimit-Reset'
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  enum: [invalid_request, no_password, invalid_password, same_password]
                error_description:
                  type: string
            examples:
              no_password:
                value:
                  error: "no_password"
                  error_description: "This account has no password"
              invalid_password:
                value:
                  error: "invalid_password"
                  error_description: "Current password is incorrect"
              same_password:
                value:
                  error: "same_password"
                  error_description: "New password must be different from current password"
      '401':
        $ref: '../../components/responses.yaml#/UnauthorizedResponse'
      '403':
        $ref: '../../components/auth/responses.yaml#/AccountForbiddenResponse'
      '404':
        $ref: '../../components/responses.yaml#/NotFoundResponse'
      '429':
        $ref: '../../components/responses.yaml#/RateLimitResponse'
      '503':
        $ref: '../../components/responses.yaml#/ServiceUnavailableResponse'
      '500':
        $ref: '../../components/responses.yaml#/ServerErrorResponse'
/account/photo:
  post:
    tags:
      - Account - Profile
    summary: Upload profile photo
    description: |
      Uploads a new profile photo, replacing (and deleting) any previous one.
      The image goes in the multipart `file` field: JPEG, PNG, GIF or WebP, at
      most `PROFILE_PHOTO_MAX_SIZE_MB` (default 5 MB).

      An audit log entry is created for the stored object (and for the
      deletion of a replaced one).
    operationId: postAccountPhoto
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - file
            properties:
              file:
                type: string
                format: binary
    responses:
      '201':
        description: Photo uploaded successfully
        headers:
          X-RateLimit-Limit:
            $ref: '../../components/headers.yaml#/X-RateLimit-Limit'
          X-RateLimit-Remaining:
            $ref: '../../components/headers.yaml#/X-RateLimit-Remaining'
          X-RateLimit-Reset:
            $ref: '../../components/headers.yaml#/X-RateLimit-Reset'
        content:
          application/json:
            schema:
              type: object
              required:
                - photoUrl
                - fileName
                - mimeType
                - sizeBytes
              properties:
                photoUrl:
                  type: string
                  description: Presigned file URL for the uploaded photo (1h TTL)
                fileName:
                  type: string
                  description: Original filename
                mimeType:
                  type: string
                  description: MIME type of the file
                sizeBytes:
                  type: integer
                  description: File size in bytes
      '400':
        description: No `file` part was uploaded (`file_upload_required`), its type is not an allowed image type (`invalid_file_type`), or the multipart body is unusable — e.g. more than one file, or a field other than `file` (`invalid_request`)
        headers:
          X-RateLimit-Limit:
            $ref: '../../components/headers.yaml#/X-RateLimit-Limit'
          X-RateLimit-Remaining:
            $ref: '../../components/headers.yaml#/X-RateLimit-Remaining'
          X-RateLimit-Reset:
            $ref: '../../components/headers.yaml#/X-RateLimit-Reset'
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  enum: [file_upload_required, invalid_file_type, invalid_request]
                error_description:
                  type: string
            examples:
              file_upload_required:
                value:
                  error: "file_upload_required"
                  error_description: "No file was uploaded"
              invalid_file_type:
                value:
                  error: "invalid_file_type"
                  error_description: "Invalid file type. Allowed types: image/jpeg, image/png, image/gif, image/webp"
      '401':
        $ref: '../../components/responses.yaml#/UnauthorizedResponse'
      '403':
        $ref: '../../components/auth/responses.yaml#/AccountForbiddenResponse'
      '413':
        description: The file is larger than `PROFILE_PHOTO_MAX_SIZE_MB`, or the form carries more than 10 fields besides the file or a field over 1 KB (`payload_too_large`)
        headers:
          X-RateLimit-Limit:
            $ref: '../../components/headers.yaml#/X-RateLimit-Limit'
          X-RateLimit-Remaining:
            $ref: '../../components/headers.yaml#/X-RateLimit-Remaining'
          X-RateLimit-Reset:
            $ref: '../../components/headers.yaml#/X-RateLimit-Reset'
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  enum: [payload_too_large]
                error_description:
                  type: string
            example:
              error: "payload_too_large"
              error_description: "File too large. Maximum size: 5MB"
      '429':
        $ref: '../../components/responses.yaml#/RateLimitResponse'
      '500':
        $ref: '../../components/responses.yaml#/ServerErrorResponse'
  delete:
    tags:
      - Account - Profile
    summary: Delete profile photo
    description: |
      Deletes the user's profile photo. `404` when the user has none.

      An audit log entry is created for the deleted object.
    operationId: deleteAccountPhoto
    security:
      - BearerAuth: []
    responses:
      '204':
        description: Photo deleted successfully
        headers:
          X-RateLimit-Limit:
            $ref: '../../components/headers.yaml#/X-RateLimit-Limit'
          X-RateLimit-Remaining:
            $ref: '../../components/headers.yaml#/X-RateLimit-Remaining'
          X-RateLimit-Reset:
            $ref: '../../components/headers.yaml#/X-RateLimit-Reset'
      '401':
        $ref: '../../components/responses.yaml#/UnauthorizedResponse'
      '403':
        $ref: '../../components/auth/responses.yaml#/AccountForbiddenResponse'
      '404':
        $ref: '../../components/responses.yaml#/NotFoundResponse'
      '429':
        $ref: '../../components/responses.yaml#/RateLimitResponse'
      '500':
        $ref: '../../components/responses.yaml#/ServerErrorResponse'
/account/totp:
  get:
    tags:
      - Account - TOTP
    summary: Get TOTP status
    description: Returns the TOTP configuration status for the user
    operationId: getAccountTotp
    security:
      - BearerAuth: []
    responses:
      '200':
        description: TOTP status
        headers:
          X-RateLimit-Limit:
            $ref: '../../components/headers.yaml#/X-RateLimit-Limit'
          X-RateLimit-Remaining:
            $ref: '../../components/headers.yaml#/X-RateLimit-Remaining'
          X-RateLimit-Reset:
            $ref: '../../components/headers.yaml#/X-RateLimit-Reset'
        content:
          application/json:
            schema:
              $ref: '../../components/auth/schemas.yaml#/AccountTotpStatusResponse'
      '401':
        $ref: '../../components/responses.yaml#/UnauthorizedResponse'
      '403':
        $ref: '../../components/auth/responses.yaml#/AccountForbiddenResponse'
      '429':
        $ref: '../../components/responses.yaml#/RateLimitResponse'
      '500':
        $ref: '../../components/responses.yaml#/ServerErrorResponse'
  delete:
    tags:
      - Account - TOTP
    summary: Disable TOTP
    description: |
      Disables TOTP for the user's account. Confirmed with a current TOTP code;
      recovery codes are not accepted here. The user's recovery codes are
      deleted.
      Only core's own UI may call this (403 `forbidden` for a token issued to
      any other client, whatever its scopes), on a login under 10 minutes old
      (`auth_time`), otherwise 403 `reauth_required` and the UI signs the user
      in again with `max_age=0` before retrying.

      Every other session of the user is revoked, in the transaction that
      disables TOTP, and the user's SSO sessions end in every other browser, so silent login (`prompt=none`) and org
      switching stop working there until the user signs in again. The session
      the request's token belongs to, and the SSO session in its browser, are
      kept.

      An audit log entry is created, and an `auth.user.totp-disabled` webhook
      event is emitted. When sessions were ended, a second entry
      (`metadata.action` `sessions_revoked`) and an
      `auth.user.sessions-revoked` event record them.
    operationId: deleteAccountTotp
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/auth/schemas.yaml#/DisableTotpRequest'
    responses:
      '200':
        description: TOTP disabled successfully
        headers:
          X-RateLimit-Limit:
            $ref: '../../components/headers.yaml#/X-RateLimit-Limit'
          X-RateLimit-Remaining:
            $ref: '../../components/headers.yaml#/X-RateLimit-Remaining'
          X-RateLimit-Reset:
            $ref: '../../components/headers.yaml#/X-RateLimit-Reset'
        content:
          application/json:
            schema:
              type: object
              required:
                - success
                - message
              properties:
                success:
                  type: boolean
                message:
                  type: string
      '400':
        description: Bad request - invalid body (`invalid_request`), or TOTP is not enabled (`totp_not_enabled`)
        headers:
          X-RateLimit-Limit:
            $ref: '../../components/headers.yaml#/X-RateLimit-Limit'
          X-RateLimit-Remaining:
            $ref: '../../components/headers.yaml#/X-RateLimit-Remaining'
          X-RateLimit-Reset:
            $ref: '../../components/headers.yaml#/X-RateLimit-Reset'
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  enum: [invalid_request, totp_not_enabled]
                error_description:
                  type: string
            example:
              error: "totp_not_enabled"
              error_description: "TOTP is not enabled for your account."
      '401':
        description: Unauthorized - wrong TOTP code, or one already accepted for this user in the same or a later 30-second step (`invalid_code`), or a missing or invalid access token (`invalid_token`)
        headers:
          X-RateLimit-Limit:
            $ref: '../../components/headers.yaml#/X-RateLimit-Limit'
          X-RateLimit-Remaining:
            $ref: '../../components/headers.yaml#/X-RateLimit-Remaining'
          X-RateLimit-Reset:
            $ref: '../../components/headers.yaml#/X-RateLimit-Reset'
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  enum: [invalid_code, invalid_token]
                error_description:
                  type: string
            example:
              error: "invalid_code"
              error_description: "Invalid verification code."
      '403':
        description: Forbidden - TOTP is required for the user and cannot be disabled (`totp_required`), a token not issued to core's UI (`forbidden`), a login older than 10 minutes (`reauth_required`), or a delegated token without `core:account` (`insufficient_scope`, with a `WWW-Authenticate` challenge)
        headers:
          X-RateLimit-Limit:
            $ref: '../../components/headers.yaml#/X-RateLimit-Limit'
          X-RateLimit-Remaining:
            $ref: '../../components/headers.yaml#/X-RateLimit-Remaining'
          X-RateLimit-Reset:
            $ref: '../../components/headers.yaml#/X-RateLimit-Reset'
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  enum: [totp_required, forbidden, reauth_required, insufficient_scope]
                error_description:
                  type: string
            example:
              error: "totp_required"
              error_description: "Two-factor authentication is required for your account and cannot be disabled."
      '429':
        $ref: '../../components/responses.yaml#/RateLimitResponse'
        description: |
          Too many requests - the general limiter, or 5 wrong TOTP codes for this user
          within 5 minutes across `/v1/account/totp/*` (`too_many_requests`,
          "Too many failed 2FA attempts. Please try again later.", with `Retry-After`).
          A correct code resets the count.
      '503':
        $ref: '../../components/responses.yaml#/ServiceUnavailableResponse'
      '500':
        $ref: '../../components/responses.yaml#/ServerErrorResponse'
/account/totp/setup:
  post:
    tags:
      - Account - TOTP
    summary: Initiate TOTP setup
    description: |
      Begins TOTP enrolment for the authenticated user: returns a new secret
      and a `setupToken`, valid for `TOTP_SETUP_TTL` seconds, to confirm with
      `POST /v1/account/totp/setup/verify`. Refused with 403 `totp_disabled`
      while the system 2FA policy is `disabled`.

      Only core's own UI may call this: a token issued to any other client is
      refused with 403 `forbidden`, whatever its scopes, because such a client
      could otherwise enroll its own authenticator and lock the user out. The
      login must also be recent, `auth_time` within 10 minutes, or the answer
      is 403 `reauth_required` and the UI signs the user in again with
      `max_age=0` before retrying.
    operationId: postAccountTotpSetup
    security:
      - BearerAuth: []
    responses:
      '200':
        description: TOTP setup initiated
        headers:
          X-RateLimit-Limit:
            $ref: '../../components/headers.yaml#/X-RateLimit-Limit'
          X-RateLimit-Remaining:
            $ref: '../../components/headers.yaml#/X-RateLimit-Remaining'
          X-RateLimit-Reset:
            $ref: '../../components/headers.yaml#/X-RateLimit-Reset'
        content:
          application/json:
            schema:
              $ref: '../../components/auth/schemas.yaml#/TotpSetupResponse'
      '400':
        description: Bad request - TOTP already enabled
        headers:
          X-RateLimit-Limit:
            $ref: '../../components/headers.yaml#/X-RateLimit-Limit'
          X-RateLimit-Remaining:
            $ref: '../../components/headers.yaml#/X-RateLimit-Remaining'
          X-RateLimit-Reset:
            $ref: '../../components/headers.yaml#/X-RateLimit-Reset'
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  enum: [totp_already_enabled]
                error_description:
                  type: string
            example:
              error: "totp_already_enabled"
              error_description: "TOTP is already enabled for your account."
      '401':
        $ref: '../../components/responses.yaml#/UnauthorizedResponse'
      '403':
        description: Forbidden - the system 2FA policy is `disabled` (`totp_disabled`), a token not issued to core's UI (`forbidden`), a login older than 10 minutes (`reauth_required`), or a delegated token without `core:account` (`insufficient_scope`, with a `WWW-Authenticate` challenge)
        headers:
          X-RateLimit-Limit:
            $ref: '../../components/headers.yaml#/X-RateLimit-Limit'
          X-RateLimit-Remaining:
            $ref: '../../components/headers.yaml#/X-RateLimit-Remaining'
          X-RateLimit-Reset:
            $ref: '../../components/headers.yaml#/X-RateLimit-Reset'
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  enum: [totp_disabled, forbidden, reauth_required, insufficient_scope]
                error_description:
                  type: string
            example:
              error: "totp_disabled"
              error_description: "Two-factor authentication is disabled by the system administrator."
      '429':
        $ref: '../../components/responses.yaml#/RateLimitResponse'
      '500':
        $ref: '../../components/responses.yaml#/ServerErrorResponse'
/account/totp/setup/verify:
  post:
    tags:
      - Account - TOTP
    summary: Complete TOTP setup
    description: |
      Confirms a setup started with `POST /v1/account/totp/setup` with a code
      from the authenticator and enables TOTP. Returns the user's recovery
      codes (`totpRecoveryCodeCount` of them), shown only this once.

      Every other session of the user is revoked, in the transaction that
      enables TOTP (recorded by a `sessions_revoked` audit entry and an
      `auth.user.sessions-revoked` event), and the user's SSO sessions
      end in every other browser, so silent login (`prompt=none`) and org
      switching stop working there until the user signs in again. The session
      the request's token belongs to, and the SSO session in its browser, are
      kept.

      An audit log entry is created, and an `auth.user.totp-enabled` webhook
      event is emitted. Refused with 403 `totp_disabled` while the system 2FA
      policy is `disabled`, including for a setup started before the change,
      and with 403 `forbidden` for a token not issued to core's own UI.
    operationId: postAccountTotpSetupVerify
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/auth/schemas.yaml#/VerifySetupRequest'
    responses:
      '200':
        description: TOTP setup completed
        headers:
          X-RateLimit-Limit:
            $ref: '../../components/headers.yaml#/X-RateLimit-Limit'
          X-RateLimit-Remaining:
            $ref: '../../components/headers.yaml#/X-RateLimit-Remaining'
          X-RateLimit-Reset:
            $ref: '../../components/headers.yaml#/X-RateLimit-Reset'
        content:
          application/json:
            schema:
              $ref: '../../components/auth/schemas.yaml#/TotpSetupVerifyResponse'
      '400':
        description: Bad request - invalid body (`invalid_request`), or an unknown (`invalid_setup_token`) or expired (`setup_expired`) setup token
        headers:
          X-RateLimit-Limit:
            $ref: '../../components/headers.yaml#/X-RateLimit-Limit'
          X-RateLimit-Remaining:
            $ref: '../../components/headers.yaml#/X-RateLimit-Remaining'
          X-RateLimit-Reset:
            $ref: '../../components/headers.yaml#/X-RateLimit-Reset'
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  enum: [invalid_request, invalid_setup_token, setup_expired]
                error_description:
                  type: string
            examples:
              invalid_setup_token:
                value:
                  error: "invalid_setup_token"
                  error_description: "Invalid or expired setup token. Please start again."
              setup_expired:
                value:
                  error: "setup_expired"
                  error_description: "Setup session expired. Please start again."
      '401':
        description: Unauthorized - wrong TOTP code, or one already accepted for this user in the same or a later 30-second step (`invalid_code`), or a missing or invalid access token (`invalid_token`)
        headers:
          X-RateLimit-Limit:
            $ref: '../../components/headers.yaml#/X-RateLimit-Limit'
          X-RateLimit-Remaining:
            $ref: '../../components/headers.yaml#/X-RateLimit-Remaining'
          X-RateLimit-Reset:
            $ref: '../../components/headers.yaml#/X-RateLimit-Reset'
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  enum: [invalid_code, invalid_token]
                error_description:
                  type: string
            example:
              error: "invalid_code"
              error_description: "Invalid verification code. Please try again."
      '403':
        description: Forbidden - TOTP is disabled by policy (`totp_disabled`), the setup token belongs to a different user or the token was not issued to core's UI (`forbidden`), or a delegated token without `core:account` (`insufficient_scope`, with a `WWW-Authenticate` challenge)
        headers:
          X-RateLimit-Limit:
            $ref: '../../components/headers.yaml#/X-RateLimit-Limit'
          X-RateLimit-Remaining:
            $ref: '../../components/headers.yaml#/X-RateLimit-Remaining'
          X-RateLimit-Reset:
            $ref: '../../components/headers.yaml#/X-RateLimit-Reset'
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  enum: [totp_disabled, forbidden, insufficient_scope]
                error_description:
                  type: string
            examples:
              totp_disabled:
                value:
                  error: "totp_disabled"
                  error_description: "Two-factor authentication is disabled by the system administrator."
              forbidden:
                value:
                  error: "forbidden"
                  error_description: "This setup token does not belong to you."
      '429':
        $ref: '../../components/responses.yaml#/RateLimitResponse'
        description: |
          Too many requests - the general limiter, or 5 wrong TOTP codes for this user
          within 5 minutes across `/v1/account/totp/*` (`too_many_requests`,
          "Too many failed 2FA attempts. Please try again later.", with `Retry-After`).
          A correct code resets the count.
      '503':
        $ref: '../../components/responses.yaml#/ServiceUnavailableResponse'
      '500':
        $ref: '../../components/responses.yaml#/ServerErrorResponse'
/account/totp/recovery-codes:
  post:
    tags:
      - Account - TOTP
    summary: Regenerate recovery codes
    description: |
      Generates a new set of recovery codes, replacing every existing one.
      Confirmed with a current TOTP code; recovery codes are not accepted
      here. The number of codes is the `totpRecoveryCodeCount` setting.

      Only core's own UI may call this (403 `forbidden` for a token issued to
      any other client, whatever its scopes), on a login under 10 minutes old
      (`auth_time`), otherwise 403 `reauth_required` and the UI signs the user
      in again with `max_age=0` before retrying.

      An audit log entry is created for this action.
      An `auth.user.recovery-codes-regenerated` webhook event is emitted.
    operationId: postAccountTotpRecoveryCodes
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/auth/schemas.yaml#/RegenerateRecoveryCodesRequest'
    responses:
      '200':
        description: New recovery codes generated
        headers:
          X-RateLimit-Limit:
            $ref: '../../components/headers.yaml#/X-RateLimit-Limit'
          X-RateLimit-Remaining:
            $ref: '../../components/headers.yaml#/X-RateLimit-Remaining'
          X-RateLimit-Reset:
            $ref: '../../components/headers.yaml#/X-RateLimit-Reset'
        content:
          application/json:
            schema:
              $ref: '../../components/auth/schemas.yaml#/RecoveryCodesResponse'
      '400':
        description: Bad request - invalid body (`invalid_request`), or TOTP is not enabled (`totp_not_enabled`)
        headers:
          X-RateLimit-Limit:
            $ref: '../../components/headers.yaml#/X-RateLimit-Limit'
          X-RateLimit-Remaining:
            $ref: '../../components/headers.yaml#/X-RateLimit-Remaining'
          X-RateLimit-Reset:
            $ref: '../../components/headers.yaml#/X-RateLimit-Reset'
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  enum: [invalid_request, totp_not_enabled]
                error_description:
                  type: string
            example:
              error: "totp_not_enabled"
              error_description: "TOTP is not enabled for your account."
      '401':
        description: Unauthorized - wrong TOTP code, or one already accepted for this user in the same or a later 30-second step (`invalid_code`), or a missing or invalid access token (`invalid_token`)
        headers:
          X-RateLimit-Limit:
            $ref: '../../components/headers.yaml#/X-RateLimit-Limit'
          X-RateLimit-Remaining:
            $ref: '../../components/headers.yaml#/X-RateLimit-Remaining'
          X-RateLimit-Reset:
            $ref: '../../components/headers.yaml#/X-RateLimit-Reset'
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  enum: [invalid_code, invalid_token]
                error_description:
                  type: string
            example:
              error: "invalid_code"
              error_description: "Invalid verification code."
      '403':
        description: Forbidden - a token not issued to core's UI (`forbidden`), a login older than 10 minutes (`reauth_required`), or a delegated token without `core:account` (`insufficient_scope`, with a `WWW-Authenticate` challenge)
        headers:
          X-RateLimit-Limit:
            $ref: '../../components/headers.yaml#/X-RateLimit-Limit'
          X-RateLimit-Remaining:
            $ref: '../../components/headers.yaml#/X-RateLimit-Remaining'
          X-RateLimit-Reset:
            $ref: '../../components/headers.yaml#/X-RateLimit-Reset'
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  enum: [forbidden, reauth_required, insufficient_scope]
                error_description:
                  type: string
            example:
              error: "reauth_required"
              error_description: "Sign in again to change how you sign in"
      '429':
        $ref: '../../components/responses.yaml#/RateLimitResponse'
        description: |
          Too many requests - the general limiter, or 5 wrong TOTP codes for this user
          within 5 minutes across `/v1/account/totp/*` (`too_many_requests`,
          "Too many failed 2FA attempts. Please try again later.", with `Retry-After`).
          A correct code resets the count.
      '503':
        $ref: '../../components/responses.yaml#/ServiceUnavailableResponse'
      '500':
        $ref: '../../components/responses.yaml#/ServerErrorResponse'

# ============================================
# WEBHOOK EVENTS
# ============================================

auth.user.totp-disabled:
  post:
    tags:
      - Account - TOTP
    summary: User TOTP disabled
    description: Fired when TOTP is disabled on a user's account, by the user from `DELETE /v1/account/totp`. (An admin resets it with `POST /v1/admin/users/{id}/totp/reset`, which emits `auth.user.totp-reset`.)
    operationId: webhookUserTotpDisabled
    security: []
    parameters:
      - $ref: '../../components/parameters.yaml#/WebhookIdHeader'
      - $ref: '../../components/parameters.yaml#/WebhookEventHeader'
      - $ref: '../../components/parameters.yaml#/WebhookTimestampHeader'
      - $ref: '../../components/parameters.yaml#/WebhookSignatureHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/webhook-schemas.yaml#/OrganizationWebhookEvent'
              - type: object
                properties:
                  eventType:
                    const: auth.user.totp-disabled
                  entityType:
                    const: User
                  data:
                    type: object
                    required: [userId, email]
                    properties:
                      userId:
                        type: string
                        format: uuid
                      email:
                        type: string
    responses:
      '2XX':
        description: Any 2xx response acknowledges the delivery; anything else is retried.

auth.user.password-changed:
  post:
    tags:
      - Account - Profile
    summary: User password changed
    description: Fired when a user changes their own password with `POST /v1/account/password`, and when an SSO-only user's forced link removes their password (`reason` is then `sso_only`). (An admin setting a password through `PATCH /v1/admin/users/{id}` emits `auth.user.updated`.)
    operationId: webhookUserPasswordChanged
    security: []
    parameters:
      - $ref: '../../components/parameters.yaml#/WebhookIdHeader'
      - $ref: '../../components/parameters.yaml#/WebhookEventHeader'
      - $ref: '../../components/parameters.yaml#/WebhookTimestampHeader'
      - $ref: '../../components/parameters.yaml#/WebhookSignatureHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/webhook-schemas.yaml#/OrganizationWebhookEvent'
              - type: object
                properties:
                  eventType:
                    const: auth.user.password-changed
                  entityType:
                    const: User
                  data:
                    type: object
                    required: [userId, email]
                    properties:
                      userId:
                        type: string
                        format: uuid
                      email:
                        type: string
                      reason:
                        type: string
                        enum: [sso_only]
                        description: Present when the password was removed rather than changed — `sso_only` for the forced link of an SSO-only domain, which leaves the user with no password.
    responses:
      '2XX':
        description: Any 2xx response acknowledges the delivery; anything else is retried.

auth.user.sessions-revoked:
  post:
    tags:
      - Account - Sessions
    summary: User sessions revoked
    description: Fired when sessions of a user are revoked through `DELETE /v1/account/sessions`, `DELETE /v1/account/sessions/{sessionId}`, `DELETE /v1/admin/users/{id}/sessions`, `DELETE /v1/admin/users/{id}/sessions/all`, an admin password reset (`PATCH /v1/admin/users/{id}` with `password`) or `POST /v1/admin/users/{id}/totp/reset` — not when no session was revoked and no SSO session ended. The other sessions a user's own password or TOTP change ends, and those a deactivation without a password reset ends, emit no event.
    operationId: webhookUserSessionsRevoked
    security: []
    parameters:
      - $ref: '../../components/parameters.yaml#/WebhookIdHeader'
      - $ref: '../../components/parameters.yaml#/WebhookEventHeader'
      - $ref: '../../components/parameters.yaml#/WebhookTimestampHeader'
      - $ref: '../../components/parameters.yaml#/WebhookSignatureHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/webhook-schemas.yaml#/OrganizationWebhookEvent'
              - type: object
                properties:
                  eventType:
                    const: auth.user.sessions-revoked
                  entityType:
                    const: User
                  data:
                    type: object
                    required: [userId, email, sessionIds, ssoSessionIds]
                    properties:
                      userId:
                        type: string
                        format: uuid
                      email:
                        type: string
                      sessionIds:
                        type: array
                        items:
                          type: string
                          format: uuid
                        description: Every session (refresh token id) revoked — for a single-session revoke, the one named first, then the sibling families ended with its browser
                      ssoSessionIds:
                        type: array
                        items:
                          type: string
                          format: uuid
                        description: The SSO sessions (browsers) ended; may be empty
    responses:
      '2XX':
        description: Any 2xx response acknowledges the delivery; anything else is retried.

auth.user.recovery-codes-regenerated:
  post:
    tags:
      - Account - TOTP
    summary: User recovery codes regenerated
    description: Fired when a user's TOTP recovery codes are replaced, by the user from `POST /v1/account/totp/recovery-codes`. (An admin cannot regenerate a user's codes; `POST /v1/admin/users/{id}/totp/reset` deletes them and emits `auth.user.totp-reset`.)
    operationId: webhookUserRecoveryCodesRegenerated
    security: []
    parameters:
      - $ref: '../../components/parameters.yaml#/WebhookIdHeader'
      - $ref: '../../components/parameters.yaml#/WebhookEventHeader'
      - $ref: '../../components/parameters.yaml#/WebhookTimestampHeader'
      - $ref: '../../components/parameters.yaml#/WebhookSignatureHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/webhook-schemas.yaml#/OrganizationWebhookEvent'
              - type: object
                properties:
                  eventType:
                    const: auth.user.recovery-codes-regenerated
                  entityType:
                    const: User
                  data:
                    type: object
                    required: [userId, email]
                    properties:
                      userId:
                        type: string
                        format: uuid
                      email:
                        type: string
    responses:
      '2XX':
        description: Any 2xx response acknowledges the delivery; anything else is retried.
/account/organizations:
  get:
    tags:
      - Account - Organizations
    summary: List the caller's organizations
    description: |
      The caller's active organizations, for an organization picker. Admits a
      token with `core:account` or `core:organizations` (the latter reaches
      nothing else). Archived and inactive organizations are never listed.

      Without `search`, only the caller's memberships. With `search` (2 to 100
      characters, matched case-insensitively against name and slug), the
      matching memberships; and, when the token holds
      `organizations.support-access`, every matching active organization, with
      `member: false` and `memberRole: null` for those the caller does not
      belong to. The permission comes from the caller's roles cut down to the
      token's ceiling: `core:organizations` carries it, `core:account` does
      not. A non-holder's search returns memberships only.
    operationId: getAccountOrganizations
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../components/parameters.yaml#/LimitParam'
      - $ref: '../../components/parameters.yaml#/CursorParam'
      - name: sort
        in: query
        description: Sort field. Defaults to `name`.
        schema:
          type: string
          enum: [name, slug]
          default: name
      - name: sortDir
        in: query
        description: Sort direction. Defaults to `asc` here.
        schema:
          type: string
          enum: [asc, desc]
          default: asc
      - name: search
        in: query
        description: Case-insensitive match on name or slug, 2 to 100 characters (`400` otherwise).
        schema:
          type: string
          minLength: 2
          maxLength: 100
    responses:
      '200':
        description: A page of organizations
        headers:
          X-RateLimit-Limit:
            $ref: '../../components/headers.yaml#/X-RateLimit-Limit'
          X-RateLimit-Remaining:
            $ref: '../../components/headers.yaml#/X-RateLimit-Remaining'
          X-RateLimit-Reset:
            $ref: '../../components/headers.yaml#/X-RateLimit-Reset'
        content:
          application/json:
            schema:
              $ref: '../../components/auth/schemas.yaml#/AccountOrganizationsResponse'
      '400':
        $ref: '../../components/responses.yaml#/BadRequestResponse'
      '401':
        $ref: '../../components/responses.yaml#/UnauthorizedResponse'
      '403':
        $ref: '../../components/auth/responses.yaml#/AccountForbiddenResponse'
      '429':
        $ref: '../../components/responses.yaml#/RateLimitResponse'
      '500':
        $ref: '../../components/responses.yaml#/ServerErrorResponse'
