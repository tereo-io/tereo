/webhooks/v1/webhooks/{id}/deliveries/retry:
  parameters:
    - $ref: '../../components/webhooks/parameters.yaml#/OrganizationIdHeader'
  post:
    tags:
      - Webhook Deliveries
    summary: Bulk retry failed deliveries
    description: |
      Resets failed deliveries for a specific webhook endpoint back to `PENDING`
      status with zero attempts (and `lastAttemptAt`, the response fields and
      `errorMessage` cleared) and re-queues them for delivery, newest first.
      Only deliveries with `FAILED` status are eligible for retry. Archived
      endpoints are rejected (`409 resource_archived`), and so is an endpoint
      that is not `ACTIVE` (`400 invalid_endpoint_status`; re-enable it first).
      A delivery being reset by a concurrent retry is skipped, so it is never
      queued twice.

      Supports optional filters by date range (`createdAfter` / `createdBefore`,
      inclusive), event type, and a limit on the number of deliveries to retry
      (default 100, max 1000).

      Anyone but the endpoint's creator or a `webhooks.admin` holder retries
      only its non-file deliveries: `file-service.*` ones are left as they
      are (and naming one in `eventType` is `403`), since the endpoint's URL
      may have changed since its creator's bucket access let them through.
      A provisioned endpoint's URL comes from its document, so anyone may.

      An audit log entry is created for this action when any delivery is reset.

      **Required permissions:**
      - `webhooks.write`
    operationId: bulkRetryDeliveries
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../../components/webhooks/parameters.yaml#/WebhooksIdParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/webhooks/schemas.yaml#/BulkRetryRequest'
    responses:
      '202':
        description: Deliveries accepted for retry
        headers:
          X-RateLimit-Limit:
            $ref: '../../components/headers.yaml#/X-RateLimit-Limit'
          X-RateLimit-Remaining:
            $ref: '../../components/headers.yaml#/X-RateLimit-Remaining'
          X-RateLimit-Reset:
            $ref: '../../components/headers.yaml#/X-RateLimit-Reset'
        content:
          application/json:
            schema:
              $ref: '../../components/webhooks/schemas.yaml#/BulkRetryResponse'
      '400':
        $ref: '../../components/responses.yaml#/BadRequestResponse'
      '401':
        $ref: '../../components/webhooks/responses.yaml#/WebhooksUnauthorizedResponse'
      '403':
        $ref: '../../components/responses.yaml#/ForbiddenResponse'
      '404':
        $ref: '../../components/responses.yaml#/NotFoundResponse'
      '409':
        $ref: '../../components/webhooks/responses.yaml#/WebhooksConflictResponse'
      '429':
        $ref: '../../components/responses.yaml#/RateLimitResponse'
      '500':
        $ref: '../../components/responses.yaml#/ServerErrorResponse'

/webhooks/v1/webhooks/{id}/deliveries/{deliveryId}:
  parameters:
    - $ref: '../../components/webhooks/parameters.yaml#/OrganizationIdHeader'
  get:
    tags:
